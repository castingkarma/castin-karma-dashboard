<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Platinum Outdoors — Job Hub (Demo)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f2a37'/%3E%3Cpath d='M9 23V9h7.5a4.5 4.5 0 010 9H13' fill='none' stroke='%23d7dde4' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#18202b; --muted:#5d6878; --line:#e2e5ea;
  --brand:#1f2a37; --plat:#c9d1da; --accent:#0f8a6a; --accent-soft:#e3f4ee;
  --warn:#b26a00; --warn-soft:#fff3dc; --bad:#b42318; --bad-soft:#fde8e6; --info:#2856b6; --info-soft:#e7eefc;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.demo-bar{background:#fff3dc;color:#6b4200;text-align:center;font-size:12.5px;padding:6px 16px;border-bottom:1px solid #f1dfb8}
header.top{background:var(--brand);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 20px;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px}
.logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#e9edf1,#9aa6b3);display:grid;place-items:center;color:var(--brand);font-weight:800}
.logo small{display:block;font-weight:500;color:var(--plat);font-size:11.5px;letter-spacing:.6px;text-transform:uppercase}
.spacer{flex:1}
.toggle{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.toggle button{border:0;background:transparent;color:#dfe5ec;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.toggle button.on{background:#fff;color:var(--brand);font-weight:600}
.hdr-btn{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;padding:7px 14px;border-radius:999px;cursor:pointer;font-size:13.5px;font-weight:600;white-space:nowrap}
.hdr-btn:hover,.hdr-btn.on{background:#fff;color:var(--brand)}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 90px)}
nav.side{background:var(--panel);border-right:1px solid var(--line);padding:16px 10px}
nav.side .jobpick{padding:0 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
nav.side label{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
nav.side select{width:100%;margin-top:6px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
nav.side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;cursor:pointer;font-size:14.5px}
nav.side a:hover{background:var(--bg)}
nav.side a.on{background:var(--accent-soft);color:#075e48;font-weight:600}
nav.side a .n{margin-left:auto;font-size:12px;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:1px 8px}
main{padding:24px 28px 60px;min-width:0}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .d{font-size:12.5px;margin-top:2px}
.pos{color:var(--accent)} .neg{color:var(--bad)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-green{background:var(--accent-soft);color:#075e48}
.p-amber{background:var(--warn-soft);color:var(--warn)}
.p-blue{background:var(--info-soft);color:var(--info)}
.p-grey{background:#eef0f3;color:#4a5565}
.p-red{background:var(--bad-soft);color:var(--bad)}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.sec td{background:#f8f9fb;font-weight:700;font-size:13px;color:#334155}
tr.tot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
input.num{width:72px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;text-align:right;background:#fff}
input.txt{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#0b7558}
.btn.dark{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.mt{margin-top:16px}.mt2{margin-top:28px}
.muted{color:var(--muted)} .small{font-size:13px}
.bar{height:8px;background:#eef0f3;border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar span.over{background:var(--bad)}
/* jobs */
.jobcard{cursor:pointer;transition:border-color .15s}
.jobcard:hover{border-color:#9fb0c2}
.jobcard .thumb{height:78px;border-radius:8px;margin:-4px -4px 12px;background:linear-gradient(135deg,#d9c3a1,#a9865c)}
/* selections */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.opt{border:2px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:#fff;text-align:left;padding:0}
.opt:hover{border-color:#9fb0c2}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.opt .sw{height:86px}
.opt .b{padding:9px 10px}
.opt .b strong{display:block;font-size:13.5px}
.opt .b span{font-size:12.5px;color:var(--muted)}
.opt[disabled]{cursor:default}
/* schedule */
.gantt{display:grid;grid-template-columns:200px 1fr;min-width:720px}
.gantt .lbl{padding:8px 10px;border-bottom:1px solid var(--line);font-size:13.5px}
.gantt .lane{position:relative;border-bottom:1px solid var(--line);background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100%/30) 100%}
.gantt .lane .t{position:absolute;top:7px;bottom:7px;border-radius:6px;color:#fff;font-size:11.5px;padding:2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt .hdr{font-size:11.5px;color:var(--muted);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 0;border-bottom:1px solid var(--line)}
/* proposal */
.proposal{max-width:820px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.proposal .hero{background:linear-gradient(120deg,#1f2a37,#3a4a5c);color:#fff;padding:28px}
.proposal .hero h1{font-size:26px}
.proposal .body{padding:24px 28px}
.sigbox{border:1px dashed #9fb0c2;border-radius:10px;padding:16px;margin-top:16px;background:#fafbfc}
.signed{font-family:"Brush Script MT","Segoe Script",cursive;font-size:30px;color:#1f2a37}
/* client portal */
.steps{display:flex;gap:0;margin:8px 0 4px;overflow-x:auto}
.steps div{flex:1;min-width:92px;text-align:center;font-size:12px;color:var(--muted);position:relative;padding-top:22px}
.steps div:before{content:"";position:absolute;top:6px;left:50%;width:12px;height:12px;border-radius:50%;background:#cfd5dc;transform:translateX(-50%);z-index:1}
.steps div:after{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:#cfd5dc}
.steps div:first-child:after{display:none}
.steps div.done{color:var(--ink)} .steps div.done:before,.steps div.done:after{background:var(--accent)}
.steps div.now{color:var(--ink);font-weight:700} .steps div.now:before{background:#fff;border:3px solid var(--accent);width:14px;height:14px;top:5px}
.todo{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:16px;flex:none}
/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.scrim.show{display:flex}
.modal{background:#fff;border-radius:14px;max-width:520px;width:100%;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h2{margin-bottom:6px}
.field{margin-top:12px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:#18202b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* jobs board */
.board{display:grid;grid-template-columns:repeat(6,minmax(140px,1fr));gap:8px;min-width:900px}
.board .col{background:#f6f7f9;border-radius:10px;padding:8px;min-height:140px}
.board .colh{display:flex;justify-content:space-between;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:4px 4px 8px}
.bcard{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;cursor:pointer;font-size:13.5px}
.bcard:hover{border-color:#9fb0c2}
.bthumb{height:34px;border-radius:6px;margin-bottom:8px}
/* current schedule (compact) */
.smini{margin-top:10px}
.smrow{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(0,2fr) 130px;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.smtrack{position:relative;height:14px;background:repeating-linear-gradient(90deg,#f3f4f6 0 calc(100%/6 - 1px),#e2e5ea calc(100%/6 - 1px) calc(100%/6));border-radius:4px}
.smbar{position:absolute;top:2px;bottom:2px;border-radius:4px}.smbar.done{opacity:.45}.smbar.active{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
.smtoday{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bad)}
.smst{text-align:right}
@media (max-width:760px){.smrow{grid-template-columns:1fr auto}.smtrack{grid-column:1 / -1;order:3}}
/* schedule builder */
.sbcrews{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.screw{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;cursor:grab;touch-action:none;user-select:none;box-shadow:var(--shadow)}
.screw i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.screw:hover{border-color:var(--c)}
.sbar{cursor:grab;touch-action:none;user-select:none;padding-right:14px !important}
.sbar.locked{cursor:default}.sbar.conf{box-shadow:0 0 0 2px var(--bad)}
.sbhandle{position:absolute;right:0;top:0;bottom:0;width:10px;cursor:ew-resize;background:rgba(255,255,255,.4);border-radius:0 6px 6px 0}
.sblane.open{background-color:#fbfcfd}
.sblane.drop{background-color:var(--accent-soft) !important}
.sbhint{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted)}
.sbghost{position:fixed;z-index:80;pointer-events:none;padding:6px 12px;border-radius:999px;color:#fff;font-size:13px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25)}
/* walkthrough */
.tour .twho{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;background:rgba(95,224,181,.16);color:#9ff0d2;border:1px solid rgba(95,224,181,.4);border-radius:999px;padding:2px 10px;vertical-align:2px;white-space:nowrap}
.tour{position:sticky;top:var(--hdr,58px);z-index:18;background:#0b3b2e;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.tour .tstep{flex:1;min-width:220px;font-size:14px}
.tour .tstep b{display:block;font-size:15px}
.tour .tstep span{color:#bfe3d6;font-size:13px}
.tour .tbar{height:4px;background:rgba(255,255,255,.2);border-radius:999px;margin-top:6px;overflow:hidden}
.tour .tbar i{display:block;height:100%;background:#5fe0b5;border-radius:999px;transition:width .3s}
.tour .btn{border-color:transparent}
.tour .tnext{background:#5fe0b5;color:#06281f;min-width:150px}
.tour .tnext:hover{background:#7ce9c4}
.tour .treset{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
.tour .treset:hover{background:rgba(255,255,255,.12)}
@keyframes flashring{0%{box-shadow:0 0 0 0 rgba(15,138,106,.6)}70%{box-shadow:0 0 0 10px rgba(15,138,106,0)}100%{box-shadow:0 0 0 0 rgba(15,138,106,0)}}
.flash{animation:flashring 1.1s ease-out 2;outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
/* roles */
.rolewrap{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--plat);text-transform:uppercase;letter-spacing:.5px}
.rolesel{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:7px 12px;font-size:13.5px;text-transform:none;letter-spacing:0;max-width:240px}
.rolesel option{color:#18202b}
.hdr-btn.gold{border-color:#d6b25e;color:#f3dc9b}
.hdr-btn.gold:hover,.hdr-btn.gold.on{background:#d6b25e;color:#1f2a37}
.rolecard{padding:0 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
/* quotes */
.qsteps{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 2px}
.qsteps span{font-size:11.5px;padding:3px 8px;border-radius:999px;background:#eef0f3;color:#4a5565}
.qsteps span.done{background:var(--accent-soft);color:#075e48}
.qsteps span.now{background:var(--brand);color:#fff}
.qrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer;background:#fff}
.qrow:hover{border-color:#9fb0c2}.qrow.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.file{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-top:6px;font-size:13.5px}
.file .ext{font-size:11px;font-weight:700;background:#1f2a37;color:#fff;border-radius:5px;padding:3px 6px}
.check{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.check b{color:var(--accent)}
.qgrid{grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px}
@media (max-width:900px){.qgrid{grid-template-columns:1fr}}
@media (max-width:1180px){header.top{flex-wrap:wrap;row-gap:8px}}
/* crew calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:720px;background:#fff}
.cal .dh{font-size:12px;padding:6px;background:#f6f7f9;font-weight:700;text-align:center}
.cal .dc{min-height:96px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px}
.cal .dc:nth-child(7n+1){border-left:0}
.cal .dc .dn{font-size:11.5px;color:var(--muted)}
.cal .dc.wkend{background:#fafafa}.cal .dc.blank{background:#f3f4f6}
.calchip{font-size:11px;color:#fff;border-radius:5px;padding:2px 12px 2px 6px;margin-top:3px;cursor:grab;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;touch-action:none;user-select:none;min-height:19px;line-height:15px}
.calchip.cont{opacity:.85}.calchip.conf{box-shadow:0 0 0 2px var(--bad)}
.calhandle{position:absolute;right:0;top:0;bottom:0;width:10px;cursor:ew-resize;background:rgba(255,255,255,.4)}
body.dragging{cursor:grabbing;user-select:none}
/* field phone */
.phone{max-width:380px;margin:0 auto;border:10px solid #1f2a37;border-radius:34px;padding:20px 16px;background:#fff}
.bigbtn{width:100%;padding:15px;border-radius:12px;font-size:17px;font-weight:700;border:0;cursor:pointer;margin-top:10px}
.bigbtn.go{background:var(--accent);color:#fff}.bigbtn.alt{background:#eef0f3;color:var(--ink)}
.gate{max-width:420px;margin:24px auto}
.lanes td{vertical-align:top;font-size:13px;min-width:130px}
.lanes td a{display:block;margin-top:4px}
.perm td,.perm th{text-align:center}.perm td:first-child,.perm th:first-child{text-align:left}
/* requirements doc + print */
.reqdoc h2{font-size:17px;border-bottom:1px solid var(--line);padding-bottom:6px}
@media print{header.top,.tour,nav.side,.demo-bar,.noprint,.toast{display:none !important}.layout{display:block}main{padding:0}.card{box-shadow:none;border:0}.reqdoc .tablewrap{overflow:visible}body{background:#fff}}
/* design-file drawings */
.file.clickable{cursor:pointer}.file.clickable:hover{border-color:#9fb0c2;background:#f8fafc}
.modal.wide{max-width:1040px}
.cadwrap{border-radius:10px;overflow:hidden;border:1px solid #30363d;background:#0d1117}
.cadbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;background:#161b22;border-bottom:1px solid #30363d;color:#8b949e;font-size:12px}
.cadchip{display:inline-flex;align-items:center;gap:6px;border:1px solid #30363d;background:#0d1117;color:#c9d1d9;border-radius:6px;padding:3px 8px;font-size:11.5px;cursor:pointer;font-family:ui-monospace,Menlo,monospace}
.cadchip i{width:9px;height:9px;border-radius:2px;display:inline-block}.cadchip.off{opacity:.4;text-decoration:line-through}
.cadsvg{display:block;width:100%;height:auto;font-family:ui-monospace,Menlo,monospace}
.cadfoot{display:flex;gap:18px;flex-wrap:wrap;padding:6px 10px;background:#161b22;border-top:1px solid #30363d;color:#8b949e;font:11px ui-monospace,Menlo,monospace}
.sheet{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);border:2px solid #1f2a37;background:#fff}
.sheetplan{padding:10px;border-right:2px solid #1f2a37}
.tb{border-bottom:1px solid #1f2a37;padding:8px 10px;font-size:12.5px}.tb:last-child{border-bottom:0}
.tbbrand{font-weight:800;letter-spacing:1px}.tbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
@media (max-width:760px){.sheet{grid-template-columns:1fr}.sheetplan{border-right:0;border-bottom:2px solid #1f2a37}}
/* hidden offer hotspot + offer sheet */
.ohgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:center}
.ovalue{background:rgba(255,255,255,.06);border:1px solid rgba(214,178,94,.35);border-radius:14px;padding:18px}
.ovh{font-size:19px;font-weight:800;line-height:1.25;margin:6px 0 12px}
.ovrow{display:flex;gap:10px;align-items:baseline;font-size:13.5px;color:#c6d0db;padding:7px 0;border-top:1px solid rgba(255,255,255,.1)}
.ovrow.now{color:#fff;font-weight:700}
.ovlab{flex:none;width:52px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#8fa0b3}
.ovrow.now .ovlab{color:#d6b25e}
.ovsame{margin-top:8px;font-weight:800;color:#f3dc9b}
.ovq{font-size:13px !important;color:#c6d0db !important;margin:10px 0 0 !important;font-style:italic}
@media (max-width:900px){.ohgrid{grid-template-columns:1fr;gap:18px}}
.olevel{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fafbfc}
.olevel.urgent{border-color:#f3b4ad;background:#fff8f7}
.o3{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fafbfc;min-width:0}
.o3 table td,.o3 table th{padding:7px 6px}
.tl{margin-top:8px}

// per-job data: every job screen reads the globals above, swapped by useJob()
let curJob = 1;
const DATA = {1:{est,cos,selections,pos,schedule,otherActual}};
const J = () => jobs.find(j=>j.id===curJob);
function useJob(id){ curJob=id; ({est,cos,selections,pos,schedule,otherActual} = DATA[id]); }
function jobValue(j){ if(!DATA[j.id]) return j.value||0; const keep=curJob; useJob(j.id); const v=totals().contract; useJob(keep); return v; }

// alt job proposal (Alvarez) — unsigned, to demo the sign flow
const alvarez = {signed:false, signer:null, title:'Pool Deck &amp; Turf Transformation', client:'Rosa Alvarez', first:'Rosa', city:'Gilbert', num:'2026-118', lines:[

// ---------- calc ----------
const linePrice = l => l.q*l.c*(1+l.m/100);
const lineCost = l => l.q*l.c;
function totals(){
  const estCost = est.lines.reduce((a,l)=>a+lineCost(l),0);
  const estPrice = est.lines.reduce((a,l)=>a+linePrice(l),0);
  const appr = cos.filter(c=>c.status==='approved');
  const coCost = appr.reduce((a,c)=>a+c.lines.reduce((b,l)=>b+lineCost(l),0),0);
  const coPrice = appr.reduce((a,c)=>a+c.lines.reduce((b,l)=>b+linePrice(l),0),0);
  const contract = estPrice+coPrice, budget = estCost+coCost;
  const byCode = {};
  Object.keys(CODES).forEach(k=>byCode[k]={budget:0,actual:otherActual[k]||0,committed:0});
  est.lines.forEach(l=>byCode[l.code].budget+=lineCost(l));
  appr.forEach(c=>c.lines.forEach(l=>byCode[l.code].budget+=lineCost(l)));
  pos.forEach(p=>{ if(p.status==='billed') byCode[p.code].actual+=p.amt; else if(p.status!=='draft') byCode[p.code].committed+=p.amt; });
  const actual = Object.values(byCode).reduce((a,x)=>a+x.actual,0);
  const committed = Object.values(byCode).reduce((a,x)=>a+x.committed,0);
  return {estCost,estPrice,coPrice,contract,budget,byCode,actual,committed};
}

const laneDay = (lane,x) => { const r=lane.getBoundingClientRect(); return Math.max(0,Math.min(29,Math.floor((x-r.left)/r.width*30))); };
document.addEventListener('pointerdown', e=>{
  const chip=e.target.closest('.screw');
  if(chip){ const g=document.createElement('div'); g.className='sbghost'; g.style.background=crewColor(chip.dataset.crew); g.textContent=chip.dataset.crew;
    document.body.appendChild(g); g.style.left=e.clientX+8+'px'; g.style.top=e.clientY+8+'px'; sbDrag={mode:'new', crew:chip.dataset.crew, ghost:g}; e.preventDefault(); return; }
  const bar=e.target.closest('.sbar:not(.locked)'); if(!bar) return;
  const p=schedule[+bar.dataset.row], lane=bar.closest('.sblane');
  sbDrag={mode:e.target.classList.contains('sbhandle')?'resize':'move', p, lane, grab:laneDay(lane,e.clientX)-p.s, moved:false}; e.preventDefault();
});
document.addEventListener('pointermove', e=>{
  if(!sbDrag) return;
  if(sbDrag.mode==='new'){ sbDrag.ghost.style.left=e.clientX+8+'px'; sbDrag.ghost.style.top=e.clientY+8+'px';
    document.querySelectorAll('.sblane.drop').forEach(l=>l.classList.remove('drop')); const l=document.elementFromPoint(e.clientX,e.clientY)?.closest('.sblane'); if(l) l.classList.add('drop'); return; }
  const {p,lane}=sbDrag, d=laneDay(lane,e.clientX);
  if(sbDrag.mode==='move'){ const ns=Math.max(0,Math.min(30-p.d,d-sbDrag.grab)); if(ns!==p.s){ p.s=ns; sbDrag.moved=true; render(); sbDrag.lane=document.querySelector(`.sblane[data-row="${schedule.indexOf(p)}"]`); } }
  else { const nl=Math.max(1,Math.min(30-p.s,d-p.s+1)); if(nl!==p.d){ p.d=nl; sbDrag.moved=true; render(); sbDrag.lane=document.querySelector(`.sblane[data-row="${schedule.indexOf(p)}"]`); } }
});
document.addEventListener('pointerup', e=>{

  if(dr.mode==='new'){ dr.ghost.remove(); document.querySelectorAll('.sblane.drop').forEach(l=>l.classList.remove('drop'));
    const lane=document.elementFromPoint(e.clientX,e.clientY)?.closest('.sblane'); if(!lane) return;
    const p=schedule[+lane.dataset.row]; p.crew=dr.crew; p.c=crewColor(dr.crew); if(p.s==null) p.s=Math.min(laneDay(lane,e.clientX),30-p.d);
    render(); toast(`${dr.crew} on "${p.n}" · starts ${dayDate(p.s)}, ${p.d} days.`); return; }
  if(dr.moved) toast(`"${dr.p.n}" · ${dayDate(dr.p.s)} – ${dayDate(dr.p.s+dr.p.d-1)} (${dr.p.d} day${dr.p.d>1?'s':''}).`);
});

const qVal = q => q.lines.length ? q.lines.reduce((a,l)=>a+linePrice(l),0) : (q.val||0);
// budget check: the client's anticipated budget vs. our price + cost, against the target margin
const TARGET_M = 0.30;
const MARKS = [['Cost','C','#b42318'],['Min. price at target','minP','#b26a00'],['Our price','P','#1f2a37'],['Client budget','B','#0f8a6a']];
const qCost = q => q.lines.length ? q.lines.reduce((a,l)=>a+lineCost(l),0) : (q.val? q.val*0.70 : 0);
function budgetFit(q){
  if(!q.budget || !qVal(q)) return null;
  const B=q.budget, P=qVal(q), C=qCost(q), m=(B-C)/B;
  const v = m<0 ? ['Negative margin','p-red','neg'] : m<0.20 ? ['Low margin','p-amber','neg'] : m<=0.40 ? ['Expected margin','p-green','pos'] : ['High margin','p-blue','pos'];
  return {B,P,C,m,ourM:(P-C)/P,gap:B-P,minP:C/(1-TARGET_M),v};
}
function budgetPanel(q){
  const f = budgetFit(q);
  if(!q.budget) return '';
  if(!f) return `<div class="card" style="margin-top:12px;padding:12px;background:#f8f9fb"><strong>Budget saved: ${fmt(q.budget)}</strong><div class="small muted">The budget check appears as soon as the quote is priced.</div></div>`;
  const max = Math.max(f.B,f.P)*1.12, x = v => Math.max(0,Math.min(100,v/max*100));
  const advice = f.m<0 ? `At ${fmt(f.B)} this job loses money. Value-engineer the scope (smaller pergola, fewer pavers, turf instead of pavers) or reset the client's expectations before it's sent.`
    : f.m<0.20 ? `The budget only covers a thin margin. Trim scope or show the client a "good / better" option before sending.`
    : f.m<=0.40 ? (f.gap>=0 ? `The budget fits. You're ${fmt(f.gap)} under their number, so there's room for one upgrade (lighting, seat wall, pergola fan).` : `The budget fits at your target margin. Your price is ${fmt(-f.gap)} over their number, so price to the budget or explain the difference.`)
    : `Strong margin at their budget. You could price closer to it, or include an upgrade to win the job.`;
  return `<div class="card" style="margin-top:12px;padding:14px;border-color:#c9d3df">
    <div class="row between"><strong>Budget check</strong><span class="pill ${f.v[1]}">${f.v[0]} at their budget</span></div>
    <div class="grid g4" style="margin-top:10px;gap:10px">
      <div class="stat"><div class="k">Client budget</div><div class="v" style="font-size:19px">${fmt(f.B)}</div></div>
      <div class="stat"><div class="k">Our price</div><div class="v" style="font-size:19px">${fmt(f.P)}</div><div class="d ${f.gap>=0?'pos':'neg'}">${f.gap>=0?fmt(f.gap)+' under budget':fmt(-f.gap)+' over budget'}</div></div>
      <div class="stat"><div class="k">Our cost</div><div class="v" style="font-size:19px">${fmt(f.C)}</div><div class="d muted">margin at our price ${pct(f.ourM*100)}</div></div>
      <div class="stat"><div class="k">Margin at their budget</div><div class="v ${f.v[2]}" style="font-size:19px">${pct(f.m*100)}</div><div class="d muted">target ${Math.round(TARGET_M*100)}%</div></div>
    </div>
    <div style="position:relative;height:18px;margin:16px 6px 4px">
      <div style="position:absolute;top:5px;left:0;right:0;height:8px;border-radius:999px;background:linear-gradient(90deg,var(--bad-soft) 0 ${x(f.C)}%,#fff3dc ${x(f.C)}% ${x(f.minP)}%,var(--accent-soft) ${x(f.minP)}% 100%)"></div>
      ${MARKS.map(([l,k,c])=>`<span title="${l}" style="position:absolute;left:${x(f[k])}%;top:0;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:${c};border:3px solid #fff;box-shadow:0 0 0 1px ${c}"></span>`).join('')}
    </div>
    <div class="row small" style="gap:14px;margin-top:8px">${MARKS.map(([l,k,c])=>`<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${c};margin-right:5px"></span>${l} ${fmt(f[k])}</span>`).join('')}</div>
    <p class="small" style="margin:14px 0 0">${advice}</p>
    <p class="small muted" style="margin:6px 0 0">Lowest price that still hits the ${Math.round(TARGET_M*100)}% target: <strong>${fmt(f.minP)}</strong>. The target margin is set by Austin + Joel.</p>
  </div>`;
}

function stepBackQ(id){
  const q=QUOTES.find(x=>x.id===id), i=QSTAGES.indexOf(q.stage); if(i<=0||q.stage==='In production') return;
  const to=QSTAGES[i-1];
  if(q.stage==='Design'){ q.specs=[]; q.designer=null; }
  if(q.stage==='Pricing'){ q.files=[]; q.takeoff=[]; }
  if(q.stage==='Review'){ q.lines=[]; }
  q.stage=to; render(); toast(`Moved back to ${to}.`);
}

const CAL = [
  {id:1, jid:1, job:'Henderson Backyard', label:'Kitchen island', crew:'Masonry sub', start:2, len:5, c:'#b26a00'},
  {id:2, jid:1, job:'Henderson Backyard', label:'Turf + planting', crew:'Crew C', start:9, len:3, c:'#4d7c0f'},

];
const NOV_START = new Date(2026,10,1).getDay(), NOV_DAYS = 30;
function calConflicts(){ const out=[]; CAL.forEach((a,i)=>CAL.slice(i+1).forEach(b=>{ if(a.crew===b.crew && a.start<=b.start+b.len-1 && b.start<=a.start+a.len-1) out.push([a,b]); })); return out; }
PAGES.calendar = () => {
  const conf = calConflicts(), confIds = new Set(conf.flat().map(e=>e.id));
  const cells = []; for(let i=0;i<NOV_START;i++) cells.push(`<div class="dc blank"></div>`);
  for(let d=1; d<=NOV_DAYS; d++){
    const wd=(NOV_START+d-1)%7;
    const evs = CAL.filter(e=>d>=e.start && d<=e.start+e.len-1);
    cells.push(`<div class="dc ${wd===0||wd===6?'wkend':''}" data-day="${d}"><div class="dn">${d}</div>${evs.map(e=>{const first=d===e.start||wd===0, last=d===e.start+e.len-1;
      return `<div class="calchip ${first?'':'cont'} ${confIds.has(e.id)?'conf':''}" data-ev="${e.id}" style="background:${e.c}" title="${e.job}: ${e.label} · ${e.crew}">${first?`${e.label} · ${e.crew}`:'&nbsp;'}${last?'<span class="calhandle" title="Drag to stretch"></span>':''}</div>`}).join('')}</div>`);
  }
  while(cells.length%7) cells.push(`<div class="dc blank"></div>`);
  return `<div class="row between"><div><h1>Crew calendar · November 2026</h1><p class="sub">Drag a job to move it. Drag its right edge to make it longer or shorter. Crews and clients are notified automatically.</p></div></div>
  ${conf.length?`<div class="card" style="border-color:#f3b4ad;background:var(--bad-soft)"><strong class="neg">⚠ ${conf.length} crew conflict${conf.length>1?'s':''}</strong>${conf.map(([a,b])=>`<div class="small" style="margin-top:4px">${a.crew} is on <strong>${a.job}</strong> (${a.label}) and <strong>${b.job}</strong> (${b.label}) at the same time. Drag one to fix it.</div>`).join('')}</div>`
    :`<div class="card" style="border-color:#9fd8c6;background:var(--accent-soft)"><strong>✓ No crew conflicts</strong><div class="small muted">Every crew is booked on one job at a time.</div></div>`}
  <div class="card mt" style="padding:12px"><div class="tablewrap"><div class="cal">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dh">${x}</div>`).join('')}${cells.join('')}</div></div></div>
  <div class="row mt" style="gap:16px">${[...new Map(CAL.map(e=>[e.job,e.c])).entries()].map(([j,c])=>`<span class="small"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${c};margin-right:5px"></span>${j}</span>`).join('')}</div>`;
};
let calDrag = null;
document.addEventListener('pointerdown', e=>{
  const ch = e.target.closest('.calchip'); if(!ch) return;
  const ev = CAL.find(x=>x.id==ch.dataset.ev), day = +ch.closest('[data-day]').dataset.day;
  calDrag = {ev, mode: e.target.classList.contains('calhandle')?'resize':'move', grab: day-ev.start, moved:false};
  document.body.classList.add('dragging'); e.preventDefault();
});
document.addEventListener('pointermove', e=>{
  if(!calDrag) return;
  const cell = document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-day]'); if(!cell) return;
  const d = +cell.dataset.day, ev = calDrag.ev;
  if(calDrag.mode==='move'){ const ns=Math.min(Math.max(1,d-calDrag.grab), NOV_DAYS-ev.len+1); if(ns!==ev.start){ ev.start=ns; calDrag.moved=true; render(); } }
  else { const nl=Math.min(Math.max(1,d-ev.start+1), NOV_DAYS-ev.start+1); if(nl!==ev.len){ ev.len=nl; calDrag.moved=true; render(); } }
});
document.addEventListener('pointerup', ()=>{
  if(!calDrag) return; const {ev,moved,mode}=calDrag; calDrag=null; document.body.classList.remove('dragging');
  if(moved) toast(`${ev.job}: ${ev.label} is now Nov ${ev.start}${ev.len>1?'–'+(ev.start+ev.len-1):''} (${ev.len} day${ev.len>1?'s':''}). ${ev.crew} and the client were notified.`);
  else if(mode==='move') toast(`${ev.job}: ${ev.label} · ${ev.crew}. Drag to move, or drag the right edge to stretch.`);
});

let tourStep = 0, tourBusy = false;
function renderTour(){
  const el=document.getElementById('tour'); const n=STEPS.length;
  if(tourStep===0) el.innerHTML = `<div class="tstep"><b>▶ Guided demo: one job, start to finish</b><span>${n} clicks. Each one fills in the forms and shows you where the work lands.</span></div>
    <button class="btn tnext" onclick="nextStep()">Start the walkthrough</button>`;
  else if(tourStep>n) el.innerHTML = `<div class="tstep"><b>✓ Done: first call to final invoice</b><span>Every screen you saw shared the same job record. Nothing was typed twice.</span><div class="tbar"><i style="width:100%"></i></div></div>
    <button class="btn treset" onclick="startOver()">↺ Start over</button>`;
  else { const st=STEPS[tourStep-1];
    el.innerHTML = `<div class="tstep"><b>Step ${tourStep} of ${n}: ${st.t} <span class="twho">👤 ${st.who}</span></b><span>${st.d}</span><div class="tbar"><i style="width:${tourStep/n*100}%"></i></div></div>
    <button class="btn tnext" id="tourNext" onclick="nextStep()" ${tourBusy?'disabled':''}>${tourBusy?'Working…':tourStep===n?'Finish':'Next step →'}</button>
    <button class="btn treset" onclick="startOver()">↺ Start over</button>`; }
}
async function nextStep(){
  if(tourBusy) return;
  if(tourStep>=STEPS.length){ tourStep=STEPS.length+1; renderTour(); return; }
  tourStep++; tourBusy=true; renderTour();
  try{ await STEPS[tourStep-1].run(); } finally { tourBusy=false; renderTour(); }
}
