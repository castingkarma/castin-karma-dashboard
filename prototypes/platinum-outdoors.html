<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Platinum Outdoors — Job Hub (Demo)</title>
<style>
:root{--bg:#1f2a37;--card:#fff;--ink:#1f2a37;--mut:#64748b;--go:#0f8a6a;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);padding:16px}
form{background:var(--card);border-radius:14px;padding:28px 24px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.logo{width:40px;height:40px;border-radius:9px;background:#e9edf1;color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;margin-bottom:12px}
h1{font-size:19px;margin:0}p{color:var(--mut);font-size:14px;margin:4px 0 18px}
label{font-size:13px;font-weight:600}input{width:100%;font-size:16px;padding:11px 12px;border:1px solid #cbd5e1;border-radius:9px;margin:6px 0 12px}
button{width:100%;font-size:16px;font-weight:700;padding:12px;border:0;border-radius:9px;background:var(--go);color:#fff;cursor:pointer}button:disabled{opacity:.6}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
</style></head><body>
<form id="f" autocomplete="off"><div class="logo">P</div><h1>Platinum Outdoors · Job Hub</h1><p>Private demo. Enter the password to view.</p>
<label for="pw">Password</label><input id="pw" type="password" autofocus required>
<button id="b">View the demo</button><div class="err" id="e" role="alert"></div></form>
<script>
// view tracking: who (personal link ?r=), password-screen visits and wrong passwords; ?me=1 marks Jamin's own browser
const EP='https://ck-pulse.jamin-356.workers.dev/e', Q=new URLSearchParams(location.search);
const ls=(k,v)=>{ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(_){ return null; } };
if(Q.has('r')&&/^[a-z0-9]{1,8}$/.test(Q.get('r'))) ls('po_r',Q.get('r')); if(Q.get('me')==='1') ls('po_me','1'); if(Q.get('me')==='0') ls('po_me',null);
if(Q.has('me')||(Q.has('r')&&/^[a-z]/.test(Q.get('r')||''))){ Q.delete('me'); if(/^[a-z]/.test(Q.get('r')||'')) Q.delete('r'); history.replaceState(null,'',location.pathname+(Q.toString()?'?'+Q:'')+location.hash); }
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
let VID=ls('po_v'); if(!VID){ VID=rid(); ls('po_v',VID); } let SID=null; try{ SID=sessionStorage.getItem('po_s')||rid(); sessionStorage.setItem('po_s',SID); }catch(_){ SID=rid(); }
const ping=(ev,o)=>{ if(!/github.io$/.test(location.hostname)&&!Q.has('ptest')) return; const b=JSON.stringify(Object.assign({demo:'platinum',ev,vid:VID,sid:SID,ref:ls('po_r'),me:ls('po_me')==='1'},o||{}));
  try{ if(navigator.sendBeacon(EP,new Blob([b],{type:'text/plain'}))) return; }catch(_){} try{ fetch(EP,{method:'POST',body:b,keepalive:true,headers:{'Content-Type':'text/plain'}}); }catch(_){} };
const EXP=1795046400000;
// the device clock can be wound back, so the server's clock gets a say too; no answer in 2.5s = trust the device
async function expired(){ if(!EXP) return false; if(Date.now()>=EXP) return true;
  try{ const c=new AbortController(), t=setTimeout(()=>c.abort(),2500); const r=await fetch('https://ck-pulse.jamin-356.workers.dev/t',{cache:'no-store',signal:c.signal}); clearTimeout(t); const j=await r.json(); return +j.now>=EXP; }catch(_){ return false; } }
const D={s:"uaWII1+owgDFDhecYEMFTQ==",i:"f25N3rHiMhAm9bYI",n:250000,c:"6Nz53RtgNof58DJH+uLSH+jeJnn/DHdOxixR4In2pE6G7rvvpIZqMp2LQwE1lYa9JtpzUHZTy7+T0GeLe2osdn1NYe6wqG1h7/0KGS/wGVhSxg=="};
const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){ const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c)));
  document.open(); document.write(html); document.close(); }
// a reload inside the same tab (the demo's own Reset) stays unlocked; a new tab or visit asks again
let auto=null; try{ auto=sessionStorage.getItem('po_pw'); }catch(_){} const drop=()=>{ try{sessionStorage.removeItem('po_pw');}catch(_){} };
if(auto) expired().then(x=>{ if(x){ drop(); ping('gate',{extra:{expired:true}}); return; } open_(auto).catch(()=>{ drop(); ping('gate'); }); }); else ping('gate');
document.getElementById('f').addEventListener('submit',async ev=>{ ev.preventDefault(); const b=document.getElementById('b'), e=document.getElementById('e'), pw=document.getElementById('pw').value;
  b.disabled=true; b.textContent='Opening…'; e.textContent='';
  try{ if(await expired()){ const x=new Error('expired'); x.expired=true; throw x; } await open_(pw); try{sessionStorage.setItem('po_pw',pw);}catch(_){} }
  catch(err){ ping('bad',{extra:err&&err.expired?{len:pw.length,expired:true}:{len:pw.length}}); b.disabled=false; b.textContent='View the demo'; e.textContent=err&&err.expired?'This password has expired. Please contact the administrator.':'That password is not right. Try again.'; } });
</script></body></html>
