<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Platinum Outdoors — Job Hub (Demo)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f2a37'/%3E%3Cpath d='M9 23V9h7.5a4.5 4.5 0 010 9H13' fill='none' stroke='%23d7dde4' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#18202b; --muted:#5d6878; --line:#e2e5ea;
  --brand:#1f2a37; --plat:#c9d1da; --accent:#0f8a6a; --accent-soft:#e3f4ee;
  --warn:#b26a00; --warn-soft:#fff3dc; --bad:#b42318; --bad-soft:#fde8e6; --info:#2856b6; --info-soft:#e7eefc;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.demo-bar{background:#fff3dc;color:#6b4200;text-align:center;font-size:12.5px;padding:6px 16px;border-bottom:1px solid #f1dfb8}
header.top{background:var(--brand);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 20px;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px}
.logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#e9edf1,#9aa6b3);display:grid;place-items:center;color:var(--brand);font-weight:800}
.logo small{display:block;font-weight:500;color:var(--plat);font-size:11.5px;letter-spacing:.6px;text-transform:uppercase}
.spacer{flex:1}
.toggle{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.toggle button{border:0;background:transparent;color:#dfe5ec;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.toggle button.on{background:#fff;color:var(--brand);font-weight:600}
.hdr-btn{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;padding:7px 14px;border-radius:999px;cursor:pointer;font-size:13.5px;font-weight:600;white-space:nowrap}
.hdr-btn:hover,.hdr-btn.on{background:#fff;color:var(--brand)}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 90px)}
/* header pages (overview, costs, offer, big question) are full width: no workflow menu */
body.fullpg .layout{grid-template-columns:1fr}
body.fullpg nav.side{display:none}
nav.side{background:var(--panel);border-right:1px solid var(--line);padding:16px 10px}
nav.side .jobpick{padding:0 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
nav.side label{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
nav.side select{width:100%;margin-top:6px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
nav.side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;cursor:pointer;font-size:14.5px}
nav.side a:hover{background:var(--bg)}
nav.side a.on{background:var(--accent-soft);color:#075e48;font-weight:600}
nav.side a .n{margin-left:auto;font-size:12px;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:1px 8px}
main{padding:24px 28px 60px;min-width:0}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .d{font-size:12.5px;margin-top:2px}
.pos{color:var(--accent)} .neg{color:var(--bad)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-green{background:var(--accent-soft);color:#075e48}
.p-amber{background:var(--warn-soft);color:var(--warn)}
.p-blue{background:var(--info-soft);color:var(--info)}
.p-grey{background:#eef0f3;color:#4a5565}
.p-red{background:var(--bad-soft);color:var(--bad)}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.sec td{background:#f8f9fb;font-weight:700;font-size:13px;color:#334155}
tr.tot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
input.num{width:72px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;text-align:right;background:#fff}
input.txt{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#0b7558}
.btn.dark{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.mt{margin-top:16px}.mt2{margin-top:28px}
.muted{color:var(--muted)} .small{font-size:13px}
.bar{height:8px;background:#eef0f3;border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar span.over{background:var(--bad)}
/* jobs */
.jobcard{cursor:pointer;transition:border-color .15s}
.jobcard:hover{border-color:#9fb0c2}
.jobcard .thumb{height:78px;border-radius:8px;margin:-4px -4px 12px;background:linear-gradient(135deg,#d9c3a1,#a9865c)}
/* selections */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.opt{border:2px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:#fff;text-align:left;padding:0}
.opt:hover{border-color:#9fb0c2}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.opt .sw{height:86px}
.opt .b{padding:9px 10px}
.opt .b strong{display:block;font-size:13.5px}
.opt .b span{font-size:12.5px;color:var(--muted)}
.opt[disabled]{cursor:default}
/* schedule */
.gantt{display:grid;grid-template-columns:200px 1fr;min-width:720px}
.gantt .lbl{padding:8px 10px;border-bottom:1px solid var(--line);font-size:13.5px}
.gantt .lane{position:relative;border-bottom:1px solid var(--line);background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100%/30) 100%}
.gantt .lane .t{position:absolute;top:7px;bottom:7px;border-radius:6px;color:#fff;font-size:11.5px;padding:2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt .hdr{font-size:11.5px;color:var(--muted);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 0;border-bottom:1px solid var(--line)}
/* proposal */
.proposal{max-width:820px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.proposal .hero{background:linear-gradient(120deg,#1f2a37,#3a4a5c);color:#fff;padding:28px}
.proposal .hero h1{font-size:26px}
.proposal .body{padding:24px 28px}
.sigbox{border:1px dashed #9fb0c2;border-radius:10px;padding:16px;margin-top:16px;background:#fafbfc}
.signed{font-family:"Brush Script MT","Segoe Script",cursive;font-size:30px;color:#1f2a37}
/* client portal */
.steps{display:flex;gap:0;margin:8px 0 4px;overflow-x:auto}
.steps div{flex:1;min-width:92px;text-align:center;font-size:12px;color:var(--muted);position:relative;padding-top:22px}
.steps div:before{content:"";position:absolute;top:6px;left:50%;width:12px;height:12px;border-radius:50%;background:#cfd5dc;transform:translateX(-50%);z-index:1}
.steps div:after{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:#cfd5dc}
.steps div:first-child:after{display:none}
.steps div.done{color:var(--ink)} .steps div.done:before,.steps div.done:after{background:var(--accent)}
.steps div.now{color:var(--ink);font-weight:700} .steps div.now:before{background:#fff;border:3px solid var(--accent);width:14px;height:14px;top:5px}
.todo{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:16px;flex:none}
/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.scrim.show{display:flex}
.modal{background:#fff;border-radius:14px;max-width:520px;width:100%;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h2{margin-bottom:6px}
.field{margin-top:12px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:#18202b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* jobs board */
.board{display:grid;grid-template-columns:repeat(6,minmax(140px,1fr));gap:8px;min-width:900px}
.board .col{background:#f6f7f9;border-radius:10px;padding:8px;min-height:140px}
.board .colh{display:flex;justify-content:space-between;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:4px 4px 8px}
.bcard{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;cursor:pointer;font-size:13.5px}
.bcard:hover{border-color:#9fb0c2}
.bthumb{height:34px;border-radius:6px;margin-bottom:8px}
/* current schedule (compact) */
.smini{margin-top:10px}
.smrow{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(0,2fr) 130px;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.smtrack{position:relative;height:14px;background:repeating-linear-gradient(90deg,#f3f4f6 0 calc(100%/6 - 1px),#e2e5ea calc(100%/6 - 1px) calc(100%/6));border-radius:4px}
.smbar{position:absolute;top:2px;bottom:2px;border-radius:4px}.smbar.done{opacity:.45}.smbar.active{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
.smtoday{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bad)}
.smst{text-align:right}
@media (max-width:760px){.smrow{grid-template-columns:1fr auto}.smtrack{grid-column:1 / -1;order:3}}
/* schedule builder */
.sbcrews{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.screw{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;cursor:grab;touch-action:none;user-select:none;box-shadow:var(--shadow)}
.screw i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.screw:hover{border-color:var(--c)}
.sbar{cursor:grab;touch-action:none;user-select:none;padding-right:14px !important}
.sbar.locked{cursor:default}.sbar.conf{box-shadow:0 0 0 2px var(--bad)}
.sbhandle{position:absolute;right:0;top:0;bottom:0;width:10px;cursor:ew-resize;background:rgba(255,255,255,.4);border-radius:0 6px 6px 0}
.sblane.open{background-color:#fbfcfd}
.sblane.drop{background-color:var(--accent-soft) !important}
.sbhint{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted)}
.sbghost{position:fixed;z-index:80;pointer-events:none;padding:6px 12px;border-radius:999px;color:#fff;font-size:13px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25)}
/* walkthrough */
.tour .twho{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;background:rgba(95,224,181,.16);color:#9ff0d2;border:1px solid rgba(95,224,181,.4);border-radius:999px;padding:2px 10px;vertical-align:2px;white-space:nowrap}
.tour{position:sticky;top:var(--hdr,58px);z-index:18;background:#0b3b2e;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.tour .tstep{flex:1;min-width:220px;font-size:14px}
.tour .tstep b{display:block;font-size:15px}
.tour .tstep span{color:#bfe3d6;font-size:13px}
.tour .tbar{height:4px;background:rgba(255,255,255,.2);border-radius:999px;margin-top:6px;overflow:hidden}
.tour .tbar i{display:block;height:100%;background:#5fe0b5;border-radius:999px;transition:width .3s}
.tour .btn{border-color:transparent}
.tour .tnext{background:#5fe0b5;color:#06281f;min-width:150px}
.tour .tnext:hover{background:#7ce9c4}
.tour .treset{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
.tour .treset:hover{background:rgba(255,255,255,.12)}
@keyframes flashring{0%{box-shadow:0 0 0 0 rgba(15,138,106,.6)}70%{box-shadow:0 0 0 10px rgba(15,138,106,0)}100%{box-shadow:0 0 0 0 rgba(15,138,106,0)}}
.flash{animation:flashring 1.1s ease-out 2;outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
/* roles */
.rolewrap{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--plat);text-transform:uppercase;letter-spacing:.5px}
.rolesel{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:7px 12px;font-size:13.5px;text-transform:none;letter-spacing:0;max-width:240px}
.rolesel option{color:#18202b}
.hdr-btn.gold{border-color:#d6b25e;color:#f3dc9b}
.hdr-btn.gold:hover,.hdr-btn.gold.on{background:#d6b25e;color:#1f2a37}
.rolecard{padding:0 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
/* quotes */
.qsteps{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 2px}
.qsteps span{font-size:11.5px;padding:3px 8px;border-radius:999px;background:#eef0f3;color:#4a5565}
.qsteps span.done{background:var(--accent-soft);color:#075e48}
.qsteps span.now{background:var(--brand);color:#fff}
.qrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer;background:#fff}
.qrow:hover{border-color:#9fb0c2}.qrow.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.file{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-top:6px;font-size:13.5px}
.file .ext{font-size:11px;font-weight:700;background:#1f2a37;color:#fff;border-radius:5px;padding:3px 6px}
.check{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.check b{color:var(--accent)}
.qgrid{grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px}
@media (max-width:900px){.qgrid{grid-template-columns:1fr}}
@media (max-width:1180px){header.top{flex-wrap:wrap;row-gap:8px}}
/* crew calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:720px;background:#fff}
.cal .dh{font-size:12px;padding:6px;background:#f6f7f9;font-weight:700;text-align:center}
.cal .dc{min-height:96px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px}
.cal .dc:nth-child(7n+1){border-left:0}
.cal .dc .dn{font-size:11.5px;color:var(--muted)}
.cal .dc.wkend{background:#fafafa}.cal .dc.blank{background:#f3f4f6}
.calchip{font-size:11px;color:#fff;border-radius:5px;padding:2px 12px 2px 6px;margin-top:3px;cursor:grab;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;touch-action:none;user-select:none;min-height:19px;line-height:15px}
.calchip.cont{opacity:.85}.calchip.conf{box-shadow:0 0 0 2px var(--bad)}
.calhandle{position:absolute;right:0;top:0;bottom:0;width:10px;cursor:ew-resize;background:rgba(255,255,255,.4)}
body.dragging{cursor:grabbing;user-select:none}
/* field phone */
.phone{max-width:380px;margin:0 auto;border:10px solid #1f2a37;border-radius:34px;padding:20px 16px;background:#fff}
.bigbtn{width:100%;padding:15px;border-radius:12px;font-size:17px;font-weight:700;border:0;cursor:pointer;margin-top:10px}
.bigbtn.go{background:var(--accent);color:#fff}.bigbtn.alt{background:#eef0f3;color:var(--ink)}
.gate{max-width:420px;margin:24px auto}
.lanes td{vertical-align:top;font-size:13px;min-width:130px}
.lanes td a{display:block;margin-top:4px}
.perm td,.perm th{text-align:center}.perm td:first-child,.perm th:first-child{text-align:left}
/* requirements doc + print */
.reqdoc h2{font-size:17px;border-bottom:1px solid var(--line);padding-bottom:6px}
@media print{header.top,.tour,nav.side,.demo-bar,.noprint,.toast{display:none !important}.layout{display:block}main{padding:0}.card{box-shadow:none;border:0}.reqdoc .tablewrap{overflow:visible}body{background:#fff}}
/* design-file drawings */
.file.clickable{cursor:pointer}.file.clickable:hover{border-color:#9fb0c2;background:#f8fafc}
.modal.wide{max-width:1040px}
.cadwrap{border-radius:10px;overflow:hidden;border:1px solid #30363d;background:#0d1117}
.cadbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;background:#161b22;border-bottom:1px solid #30363d;color:#8b949e;font-size:12px}
.cadchip{display:inline-flex;align-items:center;gap:6px;border:1px solid #30363d;background:#0d1117;color:#c9d1d9;border-radius:6px;padding:3px 8px;font-size:11.5px;cursor:pointer;font-family:ui-monospace,Menlo,monospace}
.cadchip i{width:9px;height:9px;border-radius:2px;display:inline-block}.cadchip.off{opacity:.4;text-decoration:line-through}
.cadsvg{display:block;width:100%;height:auto;font-family:ui-monospace,Menlo,monospace}
.cadfoot{display:flex;gap:18px;flex-wrap:wrap;padding:6px 10px;background:#161b22;border-top:1px solid #30363d;color:#8b949e;font:11px ui-monospace,Menlo,monospace}
.sheet{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);border:2px solid #1f2a37;background:#fff}
.sheetplan{padding:10px;border-right:2px solid #1f2a37}
.tb{border-bottom:1px solid #1f2a37;padding:8px 10px;font-size:12.5px}.tb:last-child{border-bottom:0}
.tbbrand{font-weight:800;letter-spacing:1px}.tbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
@media (max-width:760px){.sheet{grid-template-columns:1fr}.sheetplan{border-right:0;border-bottom:2px solid #1f2a37}}
/* hidden offer hotspot + offer sheet */
.ohgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:center}
.ovalue{background:rgba(255,255,255,.06);border:1px solid rgba(214,178,94,.35);border-radius:14px;padding:18px}
.ovh{font-size:19px;font-weight:800;line-height:1.25;margin:6px 0 12px}
.ovrow{display:flex;gap:10px;align-items:baseline;font-size:13.5px;color:#c6d0db;padding:7px 0;border-top:1px solid rgba(255,255,255,.1)}
.ovrow.now{color:#fff;font-weight:700}
.ovlab{flex:none;width:52px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#8fa0b3}
.ovrow.now .ovlab{color:#d6b25e}
.ovsame{margin-top:8px;font-weight:800;color:#f3dc9b}
.ovq{font-size:13px !important;color:#c6d0db !important;margin:10px 0 0 !important;font-style:italic}
@media (max-width:900px){.ohgrid{grid-template-columns:1fr;gap:18px}}
.olevel{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fafbfc}
.olevel.urgent{border-color:#f3b4ad;background:#fff8f7}

function totals(){
  const estCost = est.lines.reduce((a,l)=>a+lineCost(l),0);

  const appr = cos.filter(c=>c.status==='approved');
  const coCost = appr.reduce((a,c)=>a+c.lines.reduce((b,l)=>b+lineCost(l),0),0);
  const coPrice = appr.reduce((a,c)=>a+c.lines.reduce((b,l)=>b+linePrice(l),0),0);
  const contract = estPrice+coPrice, budget = estCost+coCost;
  const byCode = {};
  Object.keys(CODES).forEach(k=>byCode[k]={budget:0,actual:otherActual[k]||0,committed:0});
  est.lines.forEach(l=>byCode[l.code].budget+=lineCost(l));
  appr.forEach(c=>c.lines.forEach(l=>byCode[l.code].budget+=lineCost(l)));
  pos.forEach(p=>{ if(p.status==='billed') byCode[p.code].actual+=p.amt; else if(p.status!=='draft') byCode[p.code].committed+=p.amt; });
  const actual = Object.values(byCode).reduce((a,x)=>a+x.actual,0);
  const committed = Object.values(byCode).reduce((a,x)=>a+x.committed,0);
  return {estCost,estPrice,coPrice,contract,budget,byCode,actual,committed};
}

function schedConf(){ const out=[]; schedule.forEach((a,i)=>schedule.slice(i+1).forEach(b=>{ if(a.crew&&a.crew===b.crew&&a.s!=null&&b.s!=null&&a.s<=b.s+b.d-1&&b.s<=a.s+a.d-1) out.push([a,b]); })); return out; }

      ?`<div class="t sbar ${set?'locked':''} ${confSet.has(p)?'conf':''}" data-row="${i}" style="left:${p.s/30*100}%;width:${p.d/30*100}%;background:${p.c||crewColor(p.crew)};opacity:${p.st==='done'?.55:1}" title="${p.n} · ${p.crew}">${p.st==='done'?'✓ ':''}${p.n}${set?'':'<span class="sbhandle" title="Drag to change the days"></span>'}</div>`

  const done = schedule.filter(x=>x.s!=null).sort((a,b)=>a.s-b.s);
  const first = done.length?Math.min(...done.map(x=>x.s)):0, last = done.length?Math.max(...done.map(x=>x.s+x.d-1)):0;
  return `<h1>${J().name}: schedule &amp; POs</h1><p class="sub">Crews and subs on one calendar. Materials ordered against the job, so cost lands in the right bucket.</p>

const ELLIS = {id:77, name:'Ellis Backyard', client:'Morgan Ellis', city:'Queen Creek', phone:'(480) 555-0174', email:'morgan.ellis@example.com', addr:'Sample address', scope:'Pavers, turf, lighting', status:'Sold', value:34800, handed:true, handedAt:1, hoNote:'Gate code 2210 · two dogs', thumb:'linear-gradient(135deg,#e2c7c9,#a8737c)'};
if(!jobs.some(j=>j.id===77)) jobs.push(ELLIS);
const KICK_PH = {DEMO:['Demo + base','Crew A',2], PAV:['Pavers + walls','Crew B',4], KIT:['Outdoor kitchen','Masonry sub',4], FIRE:['Fire feature','Masonry sub',2], PERG:['Pergola','Crew B',2], TURF:['Turf + planting','Crew C',3], LITE:['Lighting','Electrical sub',1]};
const KICK_COLOR = '#be185d';
function kickPhases(j){ const L=DATA[j.id]?.est?.lines||[], codes=L.length?[...new Set(L.map(l=>l.code))]:['DEMO','PAV','TURF','LITE'];
  const ph=['DEMO','PAV','KIT','FIRE','PERG','TURF','LITE'].filter(c=>codes.includes(c)).map(c=>({n:KICK_PH[c][0], crew:KICK_PH[c][1], d:KICK_PH[c][2], start:null}));
  ph.push({n:'Walkthrough', crew:'Crew A', d:1, start:null}); return ph; }
function schedKickoff(id){ const j=jobs.find(x=>x.id===id); if(!j) return; closeModal(); if(KICK.jid!==id) KICK={jid:id, ph:kickPhases(j), sel:null}; go('kickoff'); }
const kickOverlap = (a,al,b,bl) => a<=b+bl-1 && b<=a+al-1;
function kickClash(i){ const p=KICK.ph[i]; if(p.start==null) return null;
  const old=CAL.find(e=>e.jid!==KICK.jid && e.crew===p.crew && kickOverlap(p.start,p.d,e.start,e.len)); if(old) return `${p.crew} is already on ${old.job} (${old.label})`;
  const mine=KICK.ph.findIndex((q,k)=>k!==i && q.start!=null && q.crew===p.crew && kickOverlap(p.start,p.d,q.start,q.d)); return mine>=0?`${p.crew} is booked twice on this job`:null; }
function kickFree(crew,start,d,skip){ return start+d-1<=NOV_DAYS && !CAL.some(e=>e.jid!==KICK.jid&&e.crew===crew&&kickOverlap(start,d,e.start,e.len)) && !KICK.ph.some((q,k)=>k!==skip&&q.start!=null&&q.crew===crew&&kickOverlap(start,d,q.start,q.d)); }
PAGES.kickoff = () => { const j=jobs.find(x=>x.id===KICK.jid); if(!j) return PAGES.pm();
  const q=QUOTES.find(x=>x.jobRef===j.id||x.jobId===j.id), sels=(DATA[j.id]?.selections||[]).filter(s=>s.status==='open').length;
  const open=KICK.ph.map((p,i)=>[p,i]).filter(([p])=>p.start==null), clashes=KICK.ph.map((p,i)=>kickClash(i)).filter(Boolean);
  const cells=[]; for(let i=0;i<NOV_START;i++) cells.push(`<div class="dc blank"></div>`);
  for(let d=1; d<=NOV_DAYS; d++){ const wd=(NOV_START+d-1)%7;
    const olds=CAL.filter(e=>e.jid!==j.id && d>=e.start && d<=e.start+e.len-1), mine=KICK.ph.map((p,i)=>[p,i]).filter(([p])=>p.start!=null && d>=p.start && d<=p.start+p.d-1);
    cells.push(`<div class="dc kday ${wd===0||wd===6?'wkend':''} ${KICK.sel?'kpick':''}" data-kday="${d}" onclick="kickCell(${d})"><div class="dn">${d}</div>
      ${olds.map(e=>`<div class="kold" style="background:${e.c}" title="Already booked: ${e.job} · ${e.label} · ${e.crew}">${d===e.start||wd===0?`${e.label} · ${e.crew}`:'&nbsp;'}</div>`).join('')}
      ${mine.map(([p,i])=>`<div class="kev ${kickClash(i)?'kbad':''}" draggable="true" data-kev="${i}" style="background:${KICK_COLOR}" onclick="event.stopPropagation();kickEv(${i})" title="${p.n} · ${p.crew}${kickClash(i)?' · '+kickClash(i):''}">${d===p.start||wd===0?`<b>${p.n}</b> · ${p.crew}<span class="kx" onclick="event.stopPropagation();kickUn(${i})" title="Take it off the calendar">×</span>`:'&nbsp;'}</div>`).join('')}</div>`); }
  while(cells.length%7) cells.push(`<div class="dc blank"></div>`);
  const contact = (k,v) => `<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="small muted">${k}</span><span class="small" style="text-align:right">${v||'—'}</span></div>`;
  return `<div class="row between"><div><h1>Start a new job: ${j.name}</h1><p class="sub">Sold by Austin · ${fmt(jobValue(j))} · contract signed, deposit invoiced. Everything sales knows is below. Drag the phases onto the calendar around the work already booked.</p></div>
    <button class="btn" onclick="go('pm')">← My day</button></div>
  <div class="grid g2">
    <div class="card" id="kickClient"><h2>Client</h2>
      ${contact('Name',`<strong>${j.client}</strong>`)}${contact('Phone',j.phone||'(480) 555-0110')}${contact('Email',j.email||'client@example.com')}${contact('Job address',(j.addr||'Sample address')+', '+j.city)}
      <div class="row" style="gap:6px;margin-top:10px;flex-wrap:wrap"><button class="btn sm" onclick="toast('Demo: calling ${j.client.split(' ')[0]}…')">📞 Call</button><button class="btn sm" onclick="toast('Demo: text drafted to ${j.client.split(' ')[0]}. Nothing was sent.')">💬 Text</button><button class="btn sm" onclick="toast('Demo: welcome email drafted. Nothing was sent.')">✉️ Welcome email</button></div></div>
    <div class="card"><h2>From sales</h2>
      ${contact('Scope',q?q.scope:(j.scope||'See the signed proposal'))}${contact('Notes for the crew',j.hoNote?`<strong>${j.hoNote}</strong>`:'')}
      ${contact('Design files',q&&q.files.length?q.files.map(f=>`<a href="#" onclick="openDrawing('${q.id}','${f.t}');return false">${f.n}</a>`).join('<br>'):'On the signed proposal')}
      ${contact('Selections',sels?`${sels} still open in the client portal`:'Started in the client portal')}${contact('Signed',`Contract + 30% deposit invoice · ${fmt(jobValue(j)*0.3)}`)}</div>
  </div>
  <div class="card mt"><div class="row between" style="gap:8px;flex-wrap:wrap"><h2 style="margin:0">Phases to schedule <span class="muted" style="font-weight:500">· ${open.length} left</span></h2>
    <div class="row" style="gap:6px"><button class="btn sm" onclick="kickAuto()">Fill the next open days</button><button class="btn sm" onclick="KICK.ph.forEach(p=>p.start=null);KICK.sel=null;render()">Clear</button></div></div>
    <p class="small muted" style="margin:6px 0 0">Drag a phase onto a day (or click it, then click a day). Drag a crew onto a phase to swap who does it. Click × to take a phase off.</p>
    <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:10px">${KICK.ph.map((p,i)=>`<span class="kph ${p.start!=null?'kdone':''} ${KICK.sel&&KICK.sel[0]==='ph'&&KICK.sel[1]===i?'ksel':''}" draggable="true" data-kph="${i}" onclick="kickSel('ph',${i})"><i style="background:${crewColor(p.crew)}"></i><b>${p.n}</b> · ${p.crew} · ${p.d} day${p.d>1?'s':''}${p.start!=null?` · Nov ${p.start}${p.d>1?'–'+(p.start+p.d-1):''}`:''}</span>`).join('')}</div>
    <div class="small muted" style="margin:12px 0 4px">Crews</div><div class="row" style="gap:6px;flex-wrap:wrap">${CREWS.map(([n,c])=>`<span class="kcrew ${KICK.sel&&KICK.sel[0]==='crew'&&KICK.sel[1]===n?'ksel':''}" draggable="true" data-kcrew="${n}" onclick="kickSel('crew','${n}')"><i style="background:${c}"></i>${n}${subOf(n)&&!subOf(n).inhouse?` <span class="muted">(${subOf(n).co.replace(' (sample)','')})</span>`:''}</span>`).join('')}</div></div>
  <div class="card mt" style="padding:12px"><div class="row" style="gap:14px;margin:0 4px 8px"><span class="small"><span class="kold" style="display:inline-block;width:22px;background:#64748b">&nbsp;</span> Already booked (shaded)</span><span class="small"><span style="display:inline-block;width:22px;height:12px;border-radius:3px;background:${KICK_COLOR};vertical-align:-1px"></span> ${j.name}</span></div>
    <div class="tablewrap"><div class="cal">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dh">${x}</div>`).join('')}${cells.join('')}</div></div></div>
  ${clashes.length?`<div class="card mt" style="border-color:#f3b4ad;background:var(--bad-soft)"><strong class="neg">⚠ ${clashes.length} crew conflict${clashes.length>1?'s':''}</strong>${clashes.map(c=>`<div class="small" style="margin-top:4px">${c}. Move the phase or drop a different crew on it.</div>`).join('')}</div>`:''}
  <div class="row mt" style="justify-content:flex-end;gap:8px"><span class="small muted">${open.length?`${open.length} phase${open.length>1?'s':''} still to place`:clashes.length?'Fix the conflicts first':'Ready: crews and the client get the dates'}</span>
    <button class="btn primary" ${open.length||clashes.length?'disabled':''} onclick="kickConfirm()">Confirm schedule + notify everyone</button></div>`; };
function kickSel(t,v){ KICK.sel = KICK.sel&&KICK.sel[0]===t&&KICK.sel[1]===v ? null : [t,v]; render(); if(KICK.sel) toast(t==='ph'?'Now click a day to place it.':'Now click a phase on the calendar to give it this crew.'); }
function kickPlace(i,day){ const p=KICK.ph[i]; p.start=Math.max(1,Math.min(day,NOV_DAYS-p.d+1)); KICK.sel=null; render(); const c=kickClash(i); toast(c?`⚠ ${c}. Try another day or crew.`:`${p.n}: ${p.crew}, Nov ${p.start}${p.d>1?'–'+(p.start+p.d-1):''}. No conflicts.`); }
function kickCrew(i,crew){ const p=KICK.ph[i]; p.crew=crew; KICK.sel=null; render(); const c=kickClash(i); toast(c?`⚠ ${c}.`:`${p.n} now goes to ${crew}.`); }
function kickCell(day){ if(!KICK.sel) return; if(KICK.sel[0]==='ph') kickPlace(KICK.sel[1],day); else { const i=KICK.ph.findIndex(p=>p.start!=null&&day>=p.start&&day<=p.start+p.d-1); if(i>=0) kickCrew(i,KICK.sel[1]); } }
function kickEv(i){ if(KICK.sel&&KICK.sel[0]==='crew') return kickCrew(i,KICK.sel[1]); kickSel('ph',i); }
function kickUn(i){ KICK.ph[i].start=null; render(); }
async function kickAuto(slow){ let cur=16; for(let i=0;i<KICK.ph.length;i++){ const p=KICK.ph[i]; if(p.start!=null){ cur=Math.max(cur,p.start+p.d); continue; }
    let s=cur; while(s<=NOV_DAYS && !kickFree(p.crew,s,p.d,i)) s++; p.start=Math.min(s,NOV_DAYS-p.d+1); cur=p.start+p.d; if(slow){ render(); await wait(450); } }
  KICK.sel=null; render(); if(!slow) toast('Phases placed on the next open days, around the jobs already booked.'); }
function kickConfirm(){ const j=jobs.find(x=>x.id===KICK.jid); if(!j||KICK.ph.some(p=>p.start==null)||KICK.ph.some((p,i)=>kickClash(i))) return;
  CAL.splice(0,CAL.length,...CAL.filter(e=>e.jid!==j.id)); let nx=Math.max(0,...CAL.map(e=>e.id))+1;
  KICK.ph.forEach(p=>CAL.push({id:nx++, jid:j.id, job:j.name, label:p.n, crew:p.crew, start:p.start, len:p.d, c:KICK_COLOR}));
  const a=Math.min(...KICK.ph.map(p=>p.start)), b=Math.max(...KICK.ph.map(p=>p.start+p.d-1)); j.kicked=true; KICK={jid:null,ph:[],sel:null};
  go('pm'); toast(`${j.name} scheduled Nov ${a}–${b}. Each crew got its dates and ${j.client.split(' ')[0]} got the start date (demo: nothing was sent).`); }
document.addEventListener('dragstart', e=>{ const t=e.target.closest&&e.target.closest('[data-kph],[data-kcrew],[data-kev]'); if(!t) return;
  e.dataTransfer.setData('text/plain', t.dataset.kph!=null?'ph:'+t.dataset.kph : t.dataset.kcrew!=null?'crew:'+t.dataset.kcrew : 'ph:'+t.dataset.kev); });
document.addEventListener('dragover', e=>{ if(page==='kickoff' && e.target.closest&&e.target.closest('[data-kday]')) e.preventDefault(); });
document.addEventListener('drop', e=>{ if(page!=='kickoff') return; const cell=e.target.closest&&e.target.closest('[data-kday]'); if(!cell) return; e.preventDefault();
  const [t,v]=(e.dataTransfer.getData('text/plain')||'').split(':'), day=+cell.dataset.kday;
  if(t==='ph') kickPlace(+v,day); else if(t==='crew'){ const ev=e.target.closest('[data-kev]'); const i=ev?+ev.dataset.kev:KICK.ph.findIndex(p=>p.start!=null&&day>=p.start&&day<=p.start+p.d-1); if(i>=0) kickCrew(i,v); else toast('Drop a crew onto a phase that is on the calendar.'); } });

function pmOpen(pg){ const [p,id]=pg.split('@'); if(p==='kickoff'){ schedKickoff(+id); return; } if(id&&!DATA[+id]){ go('calendar'); toast(`${jobs.find(j=>j.id==id).name}: book the kickoff on the crew calendar. Its full schedule builds from the signed estimate.`); return; } if(id) useJob(+id); go(p); }

// ---------- Instagram button: fire + sparks + confetti while hovered (stops on leave or click) ----------
let FX = {on:false, el:null, parts:[], raf:0, spawn:0};
const FX_BITS = ['🔥','🔥','🔥','✨','🎉','💥','⭐'], FX_COLORS = ['#f97316','#fbbf24','#ef4444','#22c55e','#3b82f6','#ec4899','#facc15'];
function fireStart(el){ if(FX.on) return; FX.on=true; FX.el=el; el.classList.add('lit');
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  FX.spawn=setInterval(()=>{ for(let i=0;i<6;i++) fxAdd(); }, 60); if(!FX.raf) FX.raf=requestAnimationFrame(fxTick); }
function fireStop(){ FX.on=false; clearInterval(FX.spawn); if(FX.el) FX.el.classList.remove('lit'); }
function fxAdd(){ if(!FX.el||FX.parts.length>220) return; const r=FX.el.getBoundingClientRect(), d=document.createElement('span'), emoji=Math.random()<.45;
  d.className='fxp'; if(emoji){ d.textContent=FX_BITS[Math.random()*FX_BITS.length|0]; d.style.fontSize=(14+Math.random()*16)+'px'; }
  else { const w=4+Math.random()*6; Object.assign(d.style,{width:w+'px',height:(w*1.6)+'px',background:FX_COLORS[Math.random()*FX_COLORS.length|0],borderRadius:'2px'}); }
  document.body.appendChild(d);
  const a=-Math.PI/2+(Math.random()-.5)*2.4, v=4+Math.random()*7;
  FX.parts.push({d, x:r.left+22+Math.random()*(r.width-30), y:r.top+r.height/2, vx:Math.cos(a)*v, vy:Math.sin(a)*v, rot:Math.random()*360, vr:(Math.random()-.5)*20, life:0, max:50+Math.random()*40}); }
function fxTick(){ FX.parts=FX.parts.filter(p=>{ p.life++; p.vy+=.22; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
    const o=Math.max(0,1-p.life/p.max); p.d.style.transform=`translate(${p.x}px,${p.y}px) rotate(${p.rot}deg)`; p.d.style.opacity=o;
    if(o<=0||p.y>innerHeight+40){ p.d.remove(); return false; } return true; });
  FX.raf = (FX.on||FX.parts.length) ? requestAnimationFrame(fxTick) : 0; }

  {id:2, src:'client', by:'Dana Henderson (portal)', t:'Add 2 uplights on the palm trees', photos:0, date:'Oct 25', guess:{code:'LITE', c:420, m:45, days:0}},
];
const CO_SRC = {client:['🏠','Client asked'], crew:['🚩','Crew flagged'], selection:['🎨','Selection over allowance'], office:['🗂','Office']};
const coCost = c => c.lines.reduce((a,l)=>a+lineCost(l),0);
const coMargin = c => { const p=coPriceOf(c); return p?Math.round((p-coCost(c))/p*100):0; };
const coDone = c => c.status==='approved' && c.ordered && c.scheduled && c.told;
const selOver = () => DATA[1].selections.filter(s=>s.chosen!=null && selDiff(s)>0 && !s.coMade);
const coCount = () => CO_REQ.length + selOver().length + DATA[1].cos.filter(c=>c.status==='sent').length;
PAGES.changes = () => {
  const C = DATA[1].cos, drafts=C.filter(c=>c.status==='draft'), waiting=C.filter(c=>c.status==='sent'), todo=C.filter(c=>c.status==='approved'&&!coDone(c)), done=C.filter(c=>coDone(c)||c.status==='declined');
  const signedAdd = C.filter(c=>c.status==='approved').reduce((a,c)=>a+coPriceOf(c),0);
  const src = c => { const s=CO_SRC[c.src||'office']; return `<span class="pill p-grey">${s[0]} ${s[1]}</span>`; };
  const head = (t,n,note) => `<div class="row between" style="margin:18px 0 6px"><h2 style="margin:0">${t} <span class="muted" style="font-weight:500">· ${n}</span></h2>${note?`<span class="small muted">${note}</span>`:''}</div>`;
  const coRow = (c,actions,extra='') => `<div class="card" style="padding:14px 16px;margin-top:8px"><div class="row between" style="gap:10px;align-items:flex-start;flex-wrap:wrap">
      <div style="flex:1;min-width:220px"><div class="small muted">CO-${c.n} · Henderson Backyard · ${c.date}${c.by?` · ${c.by}`:''}</div><strong>${c.title}</strong>
        <div class="small" style="margin-top:6px">${src(c)} <span class="pill p-grey">+${fmt(coPriceOf(c))}</span> <span class="pill p-grey">${coMargin(c)}% margin</span> <span class="pill p-grey">${c.days?`+${c.days} day${c.days>1?'s':''}`:'no added days'}</span></div>${extra}</div>
      <div class="row" style="gap:6px;flex-wrap:wrap">${actions}</div></div></div>`;
  return `<div class="row between"><div><h1>Change orders</h1><p class="sub">Every change on your jobs, from the first ask to done: what came in, what you've priced, what's waiting on the client and what still needs ordering or scheduling.</p></div>
    <button class="btn primary" onclick="coPrice()">+ New change order</button></div>
  <div class="card" style="border-color:#f1d49a;background:var(--warn-soft);padding:12px 16px"><strong style="color:var(--warn)">The rule: no extra work starts until the client signs.</strong> <span class="small">Crews see "not signed yet" on their phone until it is. Changes over ${fmt(CO_LIMIT)} get Austin's OK before they go out.</span></div>
  <div class="grid g4 mt">
    <div class="card stat"><div class="k">New, to price</div><div class="v ${CO_REQ.length+selOver().length?'':'pos'}">${CO_REQ.length+selOver().length}</div><div class="d muted">from clients, crews, selections</div></div>
    <div class="card stat"><div class="k">Waiting on the client</div><div class="v">${waiting.length}</div><div class="d muted">${waiting.length?`oldest ${Math.max(...waiting.map(c=>CO_TODAY-(c.sentDay||CO_TODAY)))} days`:'none'}</div></div>
    <div class="card stat"><div class="k">Signed, to finish</div><div class="v">${todo.length}</div><div class="d muted">order, schedule, tell the crew</div></div>
    <div class="card stat"><div class="k">Signed changes</div><div class="v pos">+${fmt(signedAdd)}</div><div class="d muted">added to Henderson's contract</div></div>
  </div>
  ${head('New requests',CO_REQ.length+selOver().length,'Price it, then send it')}
  ${CO_REQ.map(r=>`<div class="card" style="padding:14px 16px;margin-top:8px"><div class="row between" style="gap:10px;flex-wrap:wrap"><div style="flex:1;min-width:220px"><div class="small muted">Henderson Backyard · ${r.date} · ${r.by}</div><strong>${r.t}</strong>
      <div class="small" style="margin-top:6px"><span class="pill p-grey">${CO_SRC[r.src][0]} ${CO_SRC[r.src][1]}</span>${r.photos?` <span class="pill p-grey">📷 ${r.photos} photos</span>`:''}</div></div>
      <div class="row" style="gap:6px"><button class="btn sm primary" onclick="coPrice(${r.id})">Price it</button><button class="btn sm" onclick="coDismiss(${r.id})">Not a change</button></div></div></div>`).join('')}
  ${selOver().map(s=>`<div class="card" style="padding:14px 16px;margin-top:8px"><div class="row between" style="gap:10px;flex-wrap:wrap"><div style="flex:1;min-width:220px"><div class="small muted">Henderson Backyard · client's pick in the portal</div><strong>${s.title}: ${s.opts[s.chosen].n}</strong>
      <div class="small" style="margin-top:6px"><span class="pill p-grey">🎨 Selection over allowance</span> <span class="pill p-amber">+${fmt(selDiff(s))} over the ${fmt(s.allowance)} allowance</span></div></div>
      <button class="btn sm primary" onclick="coFromSel('${s.id}')">Make the change order</button></div></div>`).join('')}
  ${CO_REQ.length+selOver().length?'':'<p class="small pos">✓ Nothing new to price.</p>'}
  ${drafts.length?head('Drafts',drafts.length,'Priced, not sent')+drafts.map(c=>{ const i=C.indexOf(c), big=coPriceOf(c)>CO_LIMIT&&!c.ok;
     return coRow(c, big?`<button class="btn sm primary" onclick="coOk(${i})">Ask Austin to OK it</button>`:`<button class="btn sm primary" onclick="coSend(${i})">Send to client</button>`, big?`<div class="small" style="margin-top:6px;color:var(--warn)">Over ${fmt(CO_LIMIT)}: needs Austin's OK first</div>`:c.ok?`<div class="small pos" style="margin-top:6px">✓ Austin OK'd it</div>`:''); }).join(''):''}
  ${head('Waiting on the client',waiting.length,'They sign in their portal')}
  ${waiting.length?waiting.map(c=>{ const i=C.indexOf(c), d=CO_TODAY-(c.sentDay||CO_TODAY);
     return coRow(c, `<button class="btn sm" onclick="toast('Reminder sent to the client by email and text.')">Send a reminder</button><button class="btn sm primary" onclick="coSigned(${i})">Signed on site</button>`,
       `<div class="small ${d>=7?'neg':'muted'}" style="margin-top:6px">Waiting ${d} day${d===1?'':'s'}${d>=7?' · worth a call':''} · ${roleLink('client','c-changes','approve it as the client')}</div>`); }).join(''):'<p class="small muted">Nothing out for signature.</p>'}
  ${head('Signed: finish the follow-through',todo.length,'Before the crew starts it')}
  ${todo.length?todo.map(c=>{ const i=C.indexOf(c);
     const step=(ok,l,fn)=>ok?`<span class="pill p-green">✓ ${l}</span>`:`<button class="btn sm" onclick="${fn}(${i})">${l}</button>`;
     return coRow(c, step(c.ordered,'Order materials','coOrder')+step(c.scheduled,c.days?`Add ${c.days} day${c.days>1?'s':''} to schedule`:'Schedule','coSched')+step(c.told,'Tell the crew','coTell'),
       `<div class="small pos" style="margin-top:6px">✓ Signed ${c.date}. Contract and job budget already updated.</div>`); }).join(''):'<p class="small muted">Nothing signed is waiting on you.</p>'}
  ${head('Done',done.length)}
  <div class="card"><div class="tablewrap"><table><thead><tr><th>#</th><th>Change</th><th>Signed</th><th class="r">Amount</th></tr></thead><tbody>
    ${done.map(c=>`<tr><td>CO-${c.n}</td><td>${c.title}</td><td>${c.status==='declined'?'<span class="pill p-red">Declined</span>':c.date}</td><td class="r">${c.status==='declined'?'—':'+'+fmt(coPriceOf(c))}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">None yet.</td></tr>'}
  </tbody></table></div></div>`;
};
function coPrice(rid){ const r=CO_REQ.find(x=>x.id===rid), g=r?r.guess:{code:'PAV',c:0,m:35,days:0};
  openModal(`<h2>${r?'Price this change':'New change order'}</h2><p class="small muted" style="margin:0">Henderson Backyard${r?` · ${CO_SRC[r.src][1].toLowerCase()} · ${r.by}`:''}</p>
    <div class="field"><label for="co_t">What's changing</label><input class="txt" id="co_t" value="${r?r.t.replace(/"/g,'&quot;'):''}" placeholder="e.g. Extend the seat wall 4 ft"></div>
    <div class="field"><label for="co_code">Cost group</label><select class="txt" id="co_code" style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px">${Object.entries(CODES).map(([k,v])=>`<option value="${k}" ${k===g.code?'selected':''}>${v}</option>`).join('')}</select></div>
    <div class="grid g3" style="gap:10px"><div class="field"><label for="co_c">Your cost</label><input class="txt" id="co_c" type="number" min="0" value="${g.c||''}"></div>
      <div class="field"><label for="co_m">Markup %</label><input class="txt" id="co_m" type="number" min="0" value="${g.m}"></div>
      <div class="field"><label for="co_d">Days it adds</label><input class="txt" id="co_d" type="number" min="0" value="${g.days}"></div></div>
    <div class="row mt" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="coSave(${rid||0})">Save draft</button></div>`); }
function coSave(rid){ const v=k=>document.getElementById(k).value, t=v('co_t').trim(), c=+v('co_c')||0, m=+v('co_m')||0, days=Math.max(0,parseInt(v('co_d'))||0), code=v('co_code');
  if(!t||!c){ toast('Add what is changing and your cost.'); return; }
  const r=CO_REQ.find(x=>x.id===rid), C=DATA[1].cos;
  C.push({n:Math.max(0,...C.map(x=>x.n))+1, title:t, status:'draft', date:'Oct 27', src:r?r.src:'office', by:r?r.by.replace(/ \(.*\)/,''):'Justin', days, lines:[{code,d:t,q:1,u:'ls',c,m}]});
  if(r) CO_REQ.splice(CO_REQ.indexOf(r),1); closeModal(); render(); toast('Priced and saved as a draft.'); }
function coDismiss(rid){ const r=CO_REQ.find(x=>x.id===rid); CO_REQ.splice(CO_REQ.indexOf(r),1); render(); toast('Marked as part of the original scope. No change order.'); }
function coFromSel(sid){ const s=DATA[1].selections.find(x=>x.id===sid), C=DATA[1].cos, d=selDiff(s); s.coMade=true;
  C.push({n:Math.max(0,...C.map(x=>x.n))+1, title:`${s.title}: ${s.opts[s.chosen].n} (over allowance)`, status:'draft', date:'Oct 27', src:'selection', by:'Dana Henderson', days:0, lines:[{code:'LITE',d:`${s.opts[s.chosen].n} over the allowance`,q:1,u:'ls',c:d,m:0}]});
  render(); toast(`Change order drafted for the ${fmt(d)} difference.`); }
function coOk(i){ DATA[1].cos[i].ok=true; render(); toast('Austin OK’d it from his phone. Ready to send.'); }
function coSend(i){ const c=DATA[1].cos[i]; c.status='sent'; c.sentDay=CO_TODAY; render(); toast(`CO-${c.n} sent. The client gets an email and a text with a link to sign.`); }
function coSigned(i){ const c=DATA[1].cos[i]; c.status='approved'; c.date='Oct 27'; if(!c.days) c.scheduled=true; render(); toast(`CO-${c.n} signed on your phone. Contract and budget updated.`); }
function coOrder(i){ const c=DATA[1].cos[i], P=DATA[1].pos; c.ordered=true; P.push({n:'PO-'+(1040+P.length+1), v:'Vendor to pick', d:c.title, code:c.lines[0].code, amt:Math.round(coCost(c)), date:'Oct 27', status:'draft'}); render(); toast('Draft PO created on Henderson for the materials.'); }
function coSched(i){ const c=DATA[1].cos[i], S=DATA[1].schedule; c.scheduled=true; if(c.days){ const p=S.find(x=>x.st!=='done'&&x.s>=TODAY_IDX)||S[S.length-1]; p.d+=c.days; } render(); toast(c.days?`${c.days} day${c.days>1?'s':''} added to the Henderson schedule. The client sees the new date.`:'Scheduled.'); }
function coTell(i){ DATA[1].cos[i].told=true; render(); toast('Crew notified on their phones: signed, OK to start.'); }

const SUBS = [
  {id:1, co:'Platinum Outdoors install crews', inhouse:true, trade:'Hardscape + install', who:'Justin (production)', ph:'(480) 555-0100', em:'crews@yourcompany.com', coi:null, crews:[['Crew A','Leo',3],['Crew B','Luis P.',3],['Crew C','Sam D.',2]], jobs:41, ontime:96, punch:1.2, callbacks:1, rating:4.8},
  {id:2, co:'Desert Stoneworks (sample)', trade:'Masonry', who:'Leo', ph:'(480) 555-0142', em:'office@example.com', coi:'Nov 4, 2026', crews:[['Masonry sub','Leo',4]], jobs:12, ontime:88, punch:2.6, callbacks:2, rating:4.3},
  {id:3, co:'Bright Line Electric (sample)', trade:'Electrical', who:'Leo', ph:'(602) 555-0177', em:'dispatch@example.com', coi:'Aug 30, 2027', crews:[['Electrical sub','Leo',2]], jobs:18, ontime:97, punch:0.6, callbacks:0, rating:4.9},
  {id:4, co:'Valley Gas Pros (sample)', trade:'Gas lines', who:'Leo', ph:'(480) 555-0119', em:'jobs@example.com', coi:'Mar 15, 2027', crews:[['Gas sub','Leo',2]], jobs:9, ontime:74, punch:3.1, callbacks:3, rating:3.6},
];
const TODAY_D = new Date(2026,9,26);
const coiDays = x => x.coi ? Math.round((new Date(x.coi)-TODAY_D)/864e5) : 9999;
const subOf = crew => SUBS.find(x=>x.crews.some(c=>c[0]===crew));
const subGrade = x => !x.jobs ? ['New','p-grey','No jobs yet'] : x.ontime>=95&&x.rating>=4.5&&x.callbacks<=1 ? ['A','p-green','Top pick'] : x.ontime>=85&&x.rating>=4 ? ['B','p-blue','Solid'] : ['C','p-amber','Watch'];
const SUB_COLORS = ['#be185d','#0e7490','#a16207','#4338ca'];
function coiPill(x){ if(x.inhouse) return '<span class="pill p-grey">Your team</span>'; const d=coiDays(x);
  return d<0?`<span class="pill p-red">Insurance expired ${x.coi}</span>`:d<=30?`<span class="pill p-amber">Insurance expires ${x.coi}</span>`:`<span class="pill p-green">Insurance to ${x.coi}</span>`; }
PAGES.subs = () => {
  const crewsAll = SUBS.flatMap(x=>x.crews), soon = SUBS.filter(x=>!x.inhouse&&coiDays(x)<=30);
  return `<div class="row between"><div><h1>Crews + subcontractors</h1><p class="sub">Every company you work with, its crews, the main contact and its paperwork in one place. The calendar and schedule pick crews from this list, and every job they finish feeds their score.</p></div>

  <div class="grid g4">

    <div class="card stat"><div class="k">Crews</div><div class="v">${crewsAll.length}</div><div class="d muted">${crewsAll.reduce((a,c)=>a+c[2],0)} people</div></div>

    <div class="card stat"><div class="k">Booked in November</div><div class="v">${new Set(CAL.map(e=>e.crew)).size}</div><div class="d muted">crews on the calendar</div></div>
  </div>
  <div class="grid g2 mt">${SUBS.map(x=>{ const g=subGrade(x); return `<div class="card">

      <span class="pill ${g[1]}" title="Score from jobs in this system">${g[0]} · ${g[2]}</span></div>
    <div class="small" style="margin-top:10px">👤 <strong>${x.who}</strong> · ${x.ph} · ${x.em}</div>
    <div style="margin-top:8px">${coiPill(x)}</div>
    <div class="small" style="margin-top:10px"><strong>Crews:</strong> ${x.crews.map(([n,l,k])=>`<span class="pill p-grey" style="margin:2px 4px 2px 0"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${crewColor(n)};margin-right:5px"></span>${n} · ${l} · ${k} people</span>`).join('')}</div>
    <div class="grid g4" style="margin-top:12px;gap:8px">${[['On time',x.jobs?x.ontime+'%':'–'],['Punch items / job',x.jobs?x.punch:'–'],['Callbacks',x.jobs?x.callbacks:'–'],['Your rating',x.jobs?x.rating+' ★':'–']].map(([k,v])=>`<div style="background:var(--bg);border-radius:8px;padding:8px"><div class="small muted" style="font-size:11.5px">${k}</div><strong>${v}</strong></div>`).join('')}</div>

};
function subEdit(id){ const x=SUBS.find(s=>s.id===id)||{co:'',trade:'Masonry',who:'',ph:'',em:'',coi:'',crews:[]};
  openModal(`<h2>${id?'Edit':'Add'} a subcontractor</h2><p class="small muted" style="margin:0">Demo: saves in this page only.</p>
    <div class="field"><label for="s_co">Company name</label><input class="txt" id="s_co" value="${x.co}" placeholder="e.g. Sonoran Pavers LLC"></div>

    <div class="grid g2" style="gap:10px"><div class="field"><label for="s_who">Main contact</label><input class="txt" id="s_who" value="${x.who}" placeholder="Name"></div>

    <div class="field"><label for="s_cr">Crews (one per line: crew name, lead, people)</label><textarea class="txt" id="s_cr" rows="3" style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit">${x.crews.map(c=>c.join(', ')).join('\n')}</textarea></div>
    <div class="row mt" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="subSave(${id||0})">Save</button></div>`); }
function subSave(id){ const v=k=>document.getElementById(k).value.trim(); if(!v('s_co')){ toast('Add the company name.'); return; }
  const crews=v('s_cr').split('\n').map(l=>l.split(',').map(t=>t.trim())).filter(c=>c[0]).map(([n,l,k])=>[n,l||'',+k||1]);
  let x=SUBS.find(s=>s.id===id); if(!x){ x={id:Date.now(), jobs:0, ontime:0, punch:0, callbacks:0, rating:0, isNew:true}; SUBS.push(x); }

function calCoiWarn(){ const w=[]; CAL.forEach(e=>{ const x=subOf(e.crew); if(!x||x.inhouse||!x.coi) return; const end=new Date(2026,10,e.start+e.len-1), exp=new Date(x.coi);

  return w.length?`<div class="card" style="border-color:#f1d49a;background:var(--warn-soft);margin-bottom:12px"><strong style="color:var(--warn)">⚠ Paperwork before the job</strong>${w.join('')}</div>`:''; }

let calDrag = null;
document.addEventListener('pointerdown', e=>{
  const ch = e.target.closest('.calchip'); if(!ch) return;

  calDrag = {ev, mode: e.target.classList.contains('calhandle')?'resize':'move', grab: day-ev.start, moved:false};
  document.body.classList.add('dragging'); e.preventDefault();
});
document.addEventListener('pointermove', e=>{
  if(!calDrag) return;
  const cell = document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-day]'); if(!cell) return;
  const d = +cell.dataset.day, ev = calDrag.ev;
  if(calDrag.mode==='move'){ const ns=Math.min(Math.max(1,d-calDrag.grab), NOV_DAYS-ev.len+1); if(ns!==ev.start){ ev.start=ns; calDrag.moved=true; render(); } }
  else { const nl=Math.min(Math.max(1,d-ev.start+1), NOV_DAYS-ev.start+1); if(nl!==ev.len){ ev.len=nl; calDrag.moved=true; render(); } }
});
document.addEventListener('pointerup', ()=>{
  if(!calDrag) return; const {ev,moved,mode}=calDrag; calDrag=null; document.body.classList.remove('dragging');

});

let tourStep = 0, tourBusy = false;
function renderTour(){
  if(tourStep===0) tourKind=roleTour();
  const el=document.getElementById('tour'), T=TOURS[tourKind], n=T.steps.length, other=tourKind==='job'?roleTour():'job';
  if(tourStep===0) el.innerHTML = `<div class="tstep"><b>▶ Guided demo: ${T.title}</b><span>${n} clicks, starting at sign-in. ${T.blurb}</span></div>
    <button class="btn tnext" onclick="startTour('${tourKind}')">${tourKind==='client'?'Start Taylor\'s project':'Start '+T.name+'\'s day'}</button>
    <button class="btn treset" onclick="startTour('job')">Or: one job, start to finish</button>`;
  else if(tourStep>n) el.innerHTML = `<div class="tstep"><b>${T.done}</b><span>${T.doneSub}</span><div class="tbar"><i style="width:100%"></i></div></div>
    <button class="btn tnext" onclick="startTour('${other}')">Now: ${TOURS[other].title.toLowerCase()}</button>
    <button class="btn treset" onclick="tourBack()">← Back</button>
    <button class="btn treset" onclick="startOver()">↺ Start over</button>`;
  else { const st=T.steps[tourStep-1];
    el.innerHTML = `<div class="tstep"><b>Step ${tourStep} of ${n}: ${st.t} <span class="twho">👤 ${st.who}</span></b><span>${st.d}</span><div class="tbar"><i style="width:${tourStep/n*100}%"></i></div></div>
    <button class="btn treset" onclick="tourBack()" ${tourBusy?'disabled':''} title="${tourStep>1?'Go back to step '+(tourStep-1):'Back to the start of this demo'}">← Back</button>
    <button class="btn tnext" id="tourNext" onclick="nextStep()" ${tourBusy?'disabled':''}>${tourBusy?'Working…':tourStep===n?'Finish':'Next step →'}</button>
    <button class="btn treset" onclick="startOver()">↺ Start over</button>`; }
}
async function nextStep(){
  if(tourBusy) return;
  const S=tourSteps();
  if(tourStep>=S.length){ tourStep=S.length+1; renderTour(); return; }
  tourStep++; tourBusy=true; renderTour();
  try{ await S[tourStep-1].run(); } finally { tourBusy=false; renderTour(); }
}

function startOver(){ location.href = location.pathname + '?start=' + Date.now(); }
function tourBack(){ if(tourBusy) return; const n=Math.min(tourStep,TOURS[tourKind].steps.length+1)-1; location.href = location.pathname + '?tour=' + tourKind + '&upto=' + Math.max(0,n); }
async function tourReplay(k,n){ tourKind=k; tourStep=0; if(n<=0){ const r=Object.keys(ROLE_TOUR).find(x=>ROLE_TOUR[x]===k); if(r) setRole(r); else renderTour(); toast('Back to the start of this demo.'); return; }
  TOUR_FAST=true; const S=TOURS[k].steps; try{ for(let i=0;i<n&&i<S.length;i++){ await nextStep(); } } finally { TOUR_FAST=false; tourBusy=false; }
  closeModal(); renderTour(); toast(`Back on step ${tourStep}: ${S[tourStep-1].t}.`); }

const TOURS = {
  sales:{title:'A day in the life of Austin (sales)', name:'Austin', blurb:'Austin signs in, mails new leads, quotes and prices a job, and hands the sale to Justin.', done:'✓ Austin\'s day, done', doneSub:'From a postcard to a signed job on Justin\'s desk, without leaving the sales portal.', steps:SALES_STEPS},

  designer:{title:'A day in the life of Mia (designer)', name:'Mia', blurb:'Mia picks up a design, attaches the AutoCAD drawing and helps with selections.', done:'✓ Mia\'s day, done', doneSub:'Designs in, quantities ready for Austin to price.', steps:DESIGNER_STEPS},
  field:{title:'A day in the life of Leo (crew lead)', name:'Leo', blurb:'Leo confirms a new job, checks the job details, clocks in, works the checklist, finishes the phase and closes out a job.', done:'✓ Leo\'s day, done', doneSub:'No paper, no texts to the office, no receipts in the truck.', steps:FIELD_STEPS},
  client:{title:'A client from first ask to final walkthrough', name:'Taylor', blurb:'Taylor asks for a design visit, signs the proposal, pays, picks finishes, follows the build, approves a change and signs off the walkthrough.', done:'✓ Taylor\'s project, done', doneSub:'From one short form to a finished backyard, every step in the portal.', steps:CLIENT_STEPS},
  justin:{title:'A day in the life of Justin (project manager)', name:'Justin', blurb:'Justin Butler, project manager, signs in and runs the day from one screen.', done:'✓ Justin\'s day, done', doneSub:'Crews, subs, change orders and POs handled without a single call or spreadsheet.', steps:JUSTIN_STEPS},
  job:{title:'One job, start to finish', name:'the job', blurb:'Each click fills in the forms and shows where the work lands.', done:'✓ Done: first call to final invoice', doneSub:'Every screen you saw shared the same job record. Nothing was typed twice.', steps:STEPS},
};
let tourKind = 'justin';
const ROLE_TOUR = {production:'justin', owner:'sales', admin:'admin', designer:'designer', field:'field', client:'client'};
const roleTour = () => ROLE_TOUR[role]||'justin';
const tourSteps = () => TOURS[tourKind].steps;
function roleChanged(r){ if(tourBusy){ document.getElementById('roleSel').value=role; return; } if(tourStep>0){ tourStep=0; } setRole(r); renderTour(); }
function startTour(k){ if(tourBusy) return; if(tourStep>0){ location.href = location.pathname + '?tour=' + k; return; } tourKind=k; nextStep(); }

function syncTop(){ document.documentElement.style.setProperty('--hdr', document.querySelector('header.top').offsetHeight+'px'); }
window.addEventListener('resize', syncTop);

populateRoles(); render(); renderTour(); syncTop();
{ const qs=new URLSearchParams(location.search), k=qs.get('tour'), up=qs.get('upto'); if(k&&TOURS[k]){ history.replaceState(null,'',location.pathname); if(up!=null) tourReplay(k,+up); else startTour(k); } }
// logo + name: back to the start with every flow reset (the demo keeps no saved state, so a fresh load is a clean slate)
function resetDemo(){ location.replace(location.pathname + '#reset'); location.reload(); }
if(location.hash==='#reset'){ history.replaceState(null,'',location.pathname); toast('Back to the start. Every flow in the demo is reset.'); }
