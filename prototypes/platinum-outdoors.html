<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Platinum Outdoors — Job Hub (Demo)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f2a37'/%3E%3Cpath d='M9 23V9h7.5a4.5 4.5 0 010 9H13' fill='none' stroke='%23d7dde4' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#18202b; --muted:#5d6878; --line:#e2e5ea;
  --brand:#1f2a37; --plat:#c9d1da; --accent:#0f8a6a; --accent-soft:#e3f4ee;
  --warn:#b26a00; --warn-soft:#fff3dc; --bad:#b42318; --bad-soft:#fde8e6; --info:#2856b6; --info-soft:#e7eefc;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.demo-bar{background:#fff3dc;color:#6b4200;text-align:center;font-size:12.5px;padding:6px 16px;border-bottom:1px solid #f1dfb8}
header.top{background:var(--brand);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 20px;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px}
.logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#e9edf1,#9aa6b3);display:grid;place-items:center;color:var(--brand);font-weight:800}
.logo small{display:block;font-weight:500;color:var(--plat);font-size:11.5px;letter-spacing:.6px;text-transform:uppercase}
.spacer{flex:1}
.toggle{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.toggle button{border:0;background:transparent;color:#dfe5ec;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.toggle button.on{background:#fff;color:var(--brand);font-weight:600}
.hdr-btn{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;padding:7px 14px;border-radius:999px;cursor:pointer;font-size:13.5px;font-weight:600;white-space:nowrap}
.hdr-btn:hover,.hdr-btn.on{background:#fff;color:var(--brand)}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 90px)}
nav.side{background:var(--panel);border-right:1px solid var(--line);padding:16px 10px}
nav.side .jobpick{padding:0 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
nav.side label{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
nav.side select{width:100%;margin-top:6px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
nav.side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;cursor:pointer;font-size:14.5px}
nav.side a:hover{background:var(--bg)}
nav.side a.on{background:var(--accent-soft);color:#075e48;font-weight:600}
nav.side a .n{margin-left:auto;font-size:12px;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:1px 8px}
main{padding:24px 28px 60px;min-width:0}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .d{font-size:12.5px;margin-top:2px}
.pos{color:var(--accent)} .neg{color:var(--bad)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-green{background:var(--accent-soft);color:#075e48}
.p-amber{background:var(--warn-soft);color:var(--warn)}
.p-blue{background:var(--info-soft);color:var(--info)}
.p-grey{background:#eef0f3;color:#4a5565}
.p-red{background:var(--bad-soft);color:var(--bad)}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.sec td{background:#f8f9fb;font-weight:700;font-size:13px;color:#334155}
tr.tot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
input.num{width:72px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;text-align:right;background:#fff}
input.txt{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#0b7558}
.btn.dark{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.mt{margin-top:16px}.mt2{margin-top:28px}
.muted{color:var(--muted)} .small{font-size:13px}
.bar{height:8px;background:#eef0f3;border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar span.over{background:var(--bad)}
/* jobs */
.jobcard{cursor:pointer;transition:border-color .15s}
.jobcard:hover{border-color:#9fb0c2}
.jobcard .thumb{height:78px;border-radius:8px;margin:-4px -4px 12px;background:linear-gradient(135deg,#d9c3a1,#a9865c)}
/* selections */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.opt{border:2px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:#fff;text-align:left;padding:0}
.opt:hover{border-color:#9fb0c2}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.opt .sw{height:86px}
.opt .b{padding:9px 10px}
.opt .b strong{display:block;font-size:13.5px}
.opt .b span{font-size:12.5px;color:var(--muted)}
.opt[disabled]{cursor:default}
/* schedule */
.gantt{display:grid;grid-template-columns:200px 1fr;min-width:720px}
.gantt .lbl{padding:8px 10px;border-bottom:1px solid var(--line);font-size:13.5px}
.gantt .lane{position:relative;border-bottom:1px solid var(--line);background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100%/30) 100%}
.gantt .lane .t{position:absolute;top:7px;bottom:7px;border-radius:6px;color:#fff;font-size:11.5px;padding:2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt .hdr{font-size:11.5px;color:var(--muted);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 0;border-bottom:1px solid var(--line)}
/* proposal */
.proposal{max-width:820px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.proposal .hero{background:linear-gradient(120deg,#1f2a37,#3a4a5c);color:#fff;padding:28px}
.proposal .hero h1{font-size:26px}
.proposal .body{padding:24px 28px}
.sigbox{border:1px dashed #9fb0c2;border-radius:10px;padding:16px;margin-top:16px;background:#fafbfc}
.signed{font-family:"Brush Script MT","Segoe Script",cursive;font-size:30px;color:#1f2a37}
/* client portal */
.steps{display:flex;gap:0;margin:8px 0 4px;overflow-x:auto}
.steps div{flex:1;min-width:92px;text-align:center;font-size:12px;color:var(--muted);position:relative;padding-top:22px}
.steps div:before{content:"";position:absolute;top:6px;left:50%;width:12px;height:12px;border-radius:50%;background:#cfd5dc;transform:translateX(-50%);z-index:1}
.steps div:after{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:#cfd5dc}
.steps div:first-child:after{display:none}
.steps div.done{color:var(--ink)} .steps div.done:before,.steps div.done:after{background:var(--accent)}
.steps div.now{color:var(--ink);font-weight:700} .steps div.now:before{background:#fff;border:3px solid var(--accent);width:14px;height:14px;top:5px}
.todo{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:16px;flex:none}
/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.scrim.show{display:flex}
.modal{background:#fff;border-radius:14px;max-width:520px;width:100%;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h2{margin-bottom:6px}
.field{margin-top:12px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:#18202b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* leads */
.funnel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.funnel .st{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;position:relative}
.funnel .st .k{font-size:12px;color:var(--muted)}
.funnel .st .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.funnel .st .c{font-size:12px;color:var(--accent);font-weight:600}
.funnel .st .fb{height:5px;background:var(--accent);border-radius:999px;margin-top:8px;opacity:.85}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.src{display:flex;gap:12px;align-items:flex-start}
.src .ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:17px}
.postcard{border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-top:12px}
.postcard .front{background:linear-gradient(120deg,#1f2a37,#3f5468);color:#fff;padding:18px}
.postcard .front h3{margin:4px 0 6px;font-size:19px}
.postcard .back{padding:12px 18px;font-size:13px;background:#fafbfc}
td input[type=checkbox]{width:17px;height:17px}
@media (max-width:760px){.funnel{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g2{grid-template-columns:1fr}
}
@media (max-width:760px){
  header.top{padding:10px 16px;flex-wrap:wrap}
  .logo small{display:none}
  .hdr-btn{padding:6px 11px;font-size:12.5px}
  .layout{grid-template-columns:1fr}
  nav.side{border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;gap:6px;overflow-x:auto;position:sticky;top:54px;z-index:15}
  nav.side .jobpick{display:none}
  nav.side a{flex:none;padding:7px 12px;font-size:14px;background:var(--bg)}
  nav.side a .n{display:none}
  main{padding:18px 16px 60px}
  .proposal .body{padding:18px}
  .proposal .hero{padding:20px}
  .steps div{min-width:0;font-size:10.5px}
}
</style>
</head>
<body>
<div class="demo-bar">Demo prototype · sample data only · built by Casting Karma for Platinum Outdoors</div>
<header class="top">
  <div class="logo"><div class="mark">P</div><div>Platinum Outdoors<small>Job Hub</small></div></div>
  <div class="spacer"></div>
  <button class="hdr-btn" id="ovBtn" onclick="go('overview')">Project Overview</button>
  <button class="hdr-btn" id="tradBtn" onclick="go('trad')">Traditional Development</button>
  <div class="toggle" role="tablist" aria-label="View as">
    <button id="vTeam" class="on" onclick="setView('team')">Team view</button>
    <button id="vClient" onclick="setView('client')">Client view</button>

</header>
<div class="layout">
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
</div>

<div class="scrim" id="scrim" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>

const selections = [

const pos = [

// alt job proposal (Alvarez) — unsigned, to demo the sign flow

// lead signal types (only new builds are populated with real records today)
const SIGNALS = {
  build:{l:'New-build closing', pill:'p-green', why:'Bought a brand-new home from a builder. These yards are usually delivered as bare dirt.'},

  const coPrice = appr.reduce((a,c)=>a+c.lines.reduce((b,l)=>b+linePrice(l),0),0);

  const byCode = {};
  Object.keys(CODES).forEach(k=>byCode[k]={budget:0,actual:otherActual[k]||0,committed:0});
  est.lines.forEach(l=>byCode[l.code].budget+=lineCost(l));

  pos.forEach(p=>{ if(p.status==='billed') byCode[p.code].actual+=p.amt; else if(p.status!=='draft') byCode[p.code].committed+=p.amt; });
  const actual = Object.values(byCode).reduce((a,x)=>a+x.actual,0);
  const committed = Object.values(byCode).reduce((a,x)=>a+x.committed,0);
  return {estCost,estPrice,coPrice,contract,budget,byCode,actual,committed};
}

  const weeks = ['Oct 6','Oct 13','Oct 20','Oct 27','Nov 3','Nov 10'];
  const poSt = s => ({draft:'p-grey',sent:'p-blue',confirmed:'p-blue',delivered:'p-amber',billed:'p-green'}[s]);
  return `<h1>Henderson Backyard: schedule &amp; POs</h1><p class="sub">Crews and subs on one calendar. Materials ordered against the job, so cost lands in the right bucket.</p>
  <div class="card"><div class="tablewrap"><div class="gantt">
    <div class="lbl" style="font-size:12px;color:var(--muted)">Phase · crew</div><div class="hdr">${weeks.map(w=>`<div>Wk of ${w}</div>`).join('')}</div>
    ${gantt}
  </div></div></div>
  <div class="row between mt2"><h2 style="margin:0">Purchase orders</h2><button class="btn primary" onclick="toast('In the real app this opens a PO form with your vendor list and cost codes.')">+ New PO</button></div>
  <div class="card mt"><div class="tablewrap"><table>
    <thead><tr><th>PO</th><th>Vendor</th><th>Items</th><th>Delivery</th><th>Status</th><th class="r">Amount</th><th></th></tr></thead>
    <tbody>${pos.map((p,i)=>{const nx=PO_FLOW[PO_FLOW.indexOf(p.status)+1];
      return `<tr><td>${p.n}</td><td>${p.v}</td><td>${p.d}<div class="small muted">${CODES[p.code]}</div></td><td>${p.date}</td><td><span class="pill ${poSt(p.status)}">${p.status[0].toUpperCase()+p.status.slice(1)}</span></td><td class="r">${fmt(p.amt)}</td>
      <td class="r">${nx?`<button class="btn sm" onclick="advPO(${i})">Mark ${nx}</button>`:''}</td></tr>`}).join('')}</tbody>
  </table></div></div>`;
};
function advPO(i){ const p=pos[i]; p.status=PO_FLOW[PO_FLOW.indexOf(p.status)+1]; render(); toast(p.status==='billed'?`${p.n} billed. ${fmt(p.amt)} now counts as actual cost on the job.`:`${p.n} marked ${p.status}.`); }

// ---------- client pages ----------
PAGES.portal = () => {
  const t = totals();
  const openSel = selections.filter(s=>s.status==='open');
  const sentCO = cos.filter(c=>c.status==='sent');
  const stages = ['Signed','Materials','Hardscape','Kitchen','Turf','Final walk'];
  const todos = [
    ...sentCO.map(c=>`<div class="todo"><div class="ic" style="background:var(--info-soft)">📝</div><div style="flex:1"><strong>Approve change order CO-${c.n}</strong><div class="small muted">${c.title} · ${fmt(coPriceOf(c))}</div></div><button class="btn sm" onclick="go('c-changes')">Review</button></div>`),
    ...openSel.map(s=>`<div class="todo"><div class="ic" style="background:var(--warn-soft)">🎨</div><div style="flex:1"><strong>Choose your ${s.title.toLowerCase()}</strong><div class="small muted">Due ${s.due}</div></div><button class="btn sm" onclick="go('c-selections')">Choose</button></div>`),
    `<div class="todo"><div class="ic" style="background:var(--accent-soft)">💳</div><div style="flex:1"><strong>Payment 3 of 4: ${fmt(t.contract*.3)}</strong><div class="small muted">Due when the kitchen &amp; hardscape are complete</div></div><button class="btn sm" onclick="toast('Online card/ACH payment is an option for v1. We would decide that with you in discovery.')">Pay</button></div>`
  ];
  return `<h1>Hi Dana, here's your backyard</h1><p class="sub">Henderson Backyard · Scottsdale · managed by Platinum Outdoors</p>
  <div class="card"><div class="steps">${stages.map((s,i)=>`<div class="${i<2?'done':i===2?'now':''}">${s}</div>`).join('')}</div>
    <p class="small muted" style="margin:14px 0 0">Pavers are going in this week. Next up: the seat wall and your outdoor kitchen.</p></div>
  <div class="grid g2 mt">
    <div class="card"><h2>Needs your attention</h2>${todos.join('')}</div>
    <div class="card"><h2>Your contract</h2>
      <div class="row between"><span class="muted">Original proposal</span><strong>${fmt(t.estPrice)}</strong></div>
      <div class="row between" style="margin-top:8px"><span class="muted">Approved changes</span><strong>${fmt(t.coPrice)}</strong></div>
      <div class="row between" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)"><span>Total</span><strong>${fmt(t.contract)}</strong></div>
      <h2 class="mt2">Payments</h2>
      ${payments.map(p=>`<div class="row between" style="margin-top:6px"><span>${p.l}</span><span class="row" style="gap:8px">${fmt(t.contract*p.p)} <span class="pill ${p.st==='paid'?'p-green':p.st==='due'?'p-amber':'p-grey'}">${p.st}</span></span></div>`).join('')}
    </div>
  </div>
  <div class="card mt"><h2>Coming up</h2>
    ${schedule.filter(s=>s.st!=='done').slice(0,4).map(s=>`<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${s.n}</span><span class="small muted">${s.crew}</span></div>`).join('')}
  </div>`;
};
PAGES['c-selections'] = () => `<h1>Your selections</h1><p class="sub">Tap the option you want. Anything above your allowance shows the difference before you choose.</p>${selections.map(s=>selCard(s,true)).join('')}`;
PAGES['c-changes'] = () => {
  if(!cos.length) return `<h1>Change orders</h1><div class="card empty">No change orders on your project.</div>`;
  return `<h1>Change orders</h1><p class="sub">Nothing changes on your job, or your price, without your OK.</p>
  ${cos.filter(c=>c.status!=='draft').map(c=>{ const i=cos.indexOf(c); return `<div class="card mt">
    <div class="row between"><div><div class="small muted">CO-${c.n} · ${c.date}</div><strong>${c.title}</strong></div>
    <span class="pill ${c.status==='approved'?'p-green':c.status==='declined'?'p-red':'p-blue'}">${c.status==='sent'?'Needs your approval':c.status[0].toUpperCase()+c.status.slice(1)}</span></div>
    <div class="tablewrap mt"><table><tbody>${c.lines.map(l=>`<tr><td>${l.d}</td><td class="r">${fmt(linePrice(l))}</td></tr>`).join('')}<tr class="tot"><td>Change to your total</td><td class="r">+${fmt(coPriceOf(c))}</td></tr></tbody></table></div>
    ${c.status==='sent'?`<div class="row mt" style="justify-content:flex-end"><button class="btn" onclick="decCO(${i})">Decline</button><button class="btn primary" onclick="apprCO(${i},this)">Approve ${fmt(coPriceOf(c))}</button></div>`:''}
  </div>`}).join('')}`;
};
function apprCO(i,b){ b.disabled=true; b.textContent='Approving…'; setTimeout(()=>{cos[i].status='approved';cos[i].date='Oct 21';render();toast(`CO-${cos[i].n} approved. Your contract total is updated.`)},600); }
function decCO(i){ cos[i].status='declined'; render(); toast(`CO-${cos[i].n} declined. Platinum Outdoors will follow up.`); }

// ---------- modal + toast ----------
function openModal(h){ document.getElementById('modal').innerHTML=h; document.getElementById('scrim').classList.add('show'); const f=document.querySelector('#modal input'); if(f) f.focus(); }
function closeModal(){ document.getElementById('scrim').classList.remove('show'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
let tt; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),3200); }

render();
</script>
</body>
</html>
