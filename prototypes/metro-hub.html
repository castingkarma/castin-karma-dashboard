let auto=null; try{ auto=sessionStorage.getItem('mh_pw'); }catch(_){}
if(auto) open_(auto).catch(()=>{ try{sessionStorage.removeItem('mh_pw');}catch(_){} });
document.getElementById('f').addEventListener('submit',async ev=>{ ev.preventDefault(); const b=document.getElementById('b'), e=document.getElementById('e'), pw=document.getElementById('pw').value;
  b.disabled=true; b.textContent='Opening…'; e.textContent='';
  try{ await open_(pw); try{sessionStorage.setItem('mh_pw',pw);}catch(_){} }
  catch(_){ b.disabled=false; b.textContent='View the prototype'; e.textContent='That password is not right. Try again.'; } });
</script></body></html>
