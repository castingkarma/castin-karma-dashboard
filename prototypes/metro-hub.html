<style>
:root{
  --navy:#253746; --navy2:#1a2833; --blue:#6685b5; --blue2:#4f6f9f; --blue-soft:#e9eef6; --tan:#b69f83; --tan-soft:#f4efe8;
  --bg:#f3f5f8; --card:#fff; --ink:#1f2a37; --mut:#5d6878; --line:#e1e6ed;
  --good:#1d7a52; --good-soft:#e5f3ec; --warn:#9a6312; --warn-soft:#fbf1df; --bad:#b42318; --bad-soft:#fdeceb;
  --r:12px; --sh:0 1px 2px rgba(20,35,50,.06),0 4px 14px rgba(20,35,50,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Lato,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
h1,h2,h3,.jos{font-family:"Josefin Sans",Lato,sans-serif;letter-spacing:.01em}
h1{font-size:26px;margin:0 0 2px;font-weight:700;color:var(--navy)}
h2{font-size:17px;margin:0;font-weight:700;color:var(--navy)}
h3{font-size:14px;margin:0;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
a{color:var(--blue2)}
button{font:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.proto{background:var(--navy2);color:#cfd8e3;font-size:12.5px;text-align:center;padding:6px 16px}
.proto b{color:#fff}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;height:64px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line)}
.top .logo{height:34px;display:block}
.hub{font-family:"Josefin Sans";font-weight:700;color:var(--mut);font-size:13px;letter-spacing:.14em;text-transform:uppercase;border-left:1px solid var(--line);padding-left:14px;white-space:nowrap}
.burger{display:none;border:0;background:none;padding:6px;margin-left:-6px}
.search{flex:1;max-width:460px;margin-left:auto;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px 10px 36px;font:inherit;font-size:14px}
.search input:focus{outline:2px solid var(--blue);background:#fff}
.search svg{position:absolute;left:11px;top:11px;color:var(--mut)}
.results{position:absolute;top:46px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh);max-height:360px;overflow:auto;display:none}
.results.on{display:block}
.results button{display:flex;width:100%;text-align:left;gap:10px;border:0;background:none;padding:9px 12px;align-items:center}
.results button:hover,.results button:focus{background:var(--blue-soft)}
.results small{color:var(--mut);margin-left:auto;font-size:12px}
.role{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.role select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:#fff;color:var(--ink)}
.bell{position:relative;border:0;background:none;padding:6px;color:var(--navy)}
.bell i{position:absolute;top:2px;right:2px;background:var(--bad);color:#fff;font-style:normal;font-size:10px;font-weight:900;border-radius:9px;padding:0 5px}
.av{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex:none}
.wrap{display:flex;min-height:calc(100vh - 94px)}
nav.side{width:236px;flex:none;background:var(--navy);color:#c9d3df;padding:14px 10px 30px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}
.side .g{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8ea1b7;margin:16px 10px 6px;font-weight:700}
.side a{display:flex;align-items:center;gap:10px;color:#dbe3ec;text-decoration:none;padding:8px 10px;border-radius:8px;font-size:14px}
.side a:hover{background:rgba(255,255,255,.07)}
.side a.on{background:var(--blue);color:#fff}
.side a svg{flex:none;opacity:.85}
.side a .tag{margin-left:auto;font-size:10px;background:rgba(255,255,255,.14);padding:1px 6px;border-radius:9px}
.side .own{margin-top:18px;border:1px solid rgba(182,159,131,.55);color:#efe5d8}
main{flex:1;min-width:0;padding:26px 28px 60px}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.head p{margin:0;color:var(--mut)}
.head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* parts */
.btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:9px;padding:8px 14px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--blue)}
.btn.p{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.p:hover{background:var(--blue2);border-color:var(--blue2)}
.btn.s{padding:5px 10px;font-size:13px}
.btn.g{background:var(--good);border-color:var(--good);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;gap:16px}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
.c21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card>.ch{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card>.ch .r{margin-left:auto;font-size:13px;color:var(--mut)}
.kpi .l{font-size:13px;color:var(--mut);font-weight:700}
.kpi .v{font-family:"Josefin Sans";font-size:28px;font-weight:700;color:var(--navy);margin:6px 0 2px;line-height:1.1}
.kpi .d{font-size:13px;color:var(--mut)}
.up{color:var(--good);font-weight:700}.dn{color:var(--bad);font-weight:700}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--blue-soft);color:var(--blue2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.tan{background:var(--tan-soft);color:#7c6548}.pill.gray{background:#eef1f4;color:var(--mut)}
.tw{overflow-x:auto;margin:0 -18px -18px;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700;padding:10px 14px;background:#f8f9fb;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:#f8fafd}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--mut)}
.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.muted{color:var(--mut)}.small{font-size:13px}
.task{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--blue-soft);color:var(--blue2);flex:none}
.task .t{flex:1;min-width:0}.task .t b{display:block;font-size:14px}.task .t span{font-size:13px;color:var(--mut)}
.task .a{display:flex;gap:6px}
.bar{height:10px;background:#edf0f4;border-radius:6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.hb{display:grid;grid-template-columns:minmax(120px,190px) 1fr 74px;gap:10px;align-items:center;font-size:13px;margin:8px 0}
.hb .bar{height:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.prog{height:8px;background:#edf0f4;border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--blue)}
.check{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.check:last-child{border-bottom:0}
.check input{width:18px;height:18px;accent-color:var(--navy)}
.check.done span{color:var(--mut);text-decoration:line-through}
.check small{margin-left:auto;color:var(--mut)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.person{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;width:100%}
.person:hover{border-color:var(--blue)}
.person b{display:block;font-size:14px}.person span{font-size:12.5px;color:var(--mut)}
.kan{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:#eaeef3;border-radius:10px;padding:10px}
.col h3{margin:2px 4px 10px;font-size:12px}
.kc{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;font-size:13px}
.kc b{display:block;font-size:14px}
.org{display:flex;flex-direction:column;align-items:center;gap:0;overflow-x:auto;padding:6px 0 10px}
.org .lvl{display:flex;gap:14px;justify-content:center;position:relative;padding-top:18px}
.org .lvl:before{content:"";position:absolute;top:0;left:50%;height:18px;border-left:2px solid var(--line)}
.org .lvl:first-child{padding-top:0}.org .lvl:first-child:before{display:none}
.node{background:#fff;border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:9px;padding:10px 14px;min-width:160px;text-align:center;font-size:13px}
.node b{display:block;font-size:14px;color:var(--navy)}
.node.top{border-top-color:var(--tan)}
.node.dep{border-top-color:var(--navy)}
.node em{font-style:normal;color:var(--mut)}
.feat{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.feat:last-child{border-bottom:0}
.feat .ck{width:24px;height:24px;border-radius:50%;background:var(--good-soft);color:var(--good);display:flex;align-items:center;justify-content:center;flex:none;font-weight:900;font-size:13px}
.feat b{display:block}
.cmp td:first-child{font-weight:700;color:var(--navy)}
.cmp .yes{color:var(--good);font-weight:700}.cmp .no{color:var(--mut)}
.hero{background:linear-gradient(120deg,var(--navy) 0%,#31506a 60%,var(--blue2) 100%);color:#fff;border-radius:14px;padding:26px 26px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.hero h1{color:#fff;font-size:28px}
.hero p{color:#dfe7f0;margin:6px 0 0;max-width:640px}
.hero .mk{width:70px;height:auto;background:#fff;border-radius:12px;padding:8px}
.empty{padding:28px;text-align:center;color:var(--mut)}
footer.f{font-size:12.5px;color:var(--mut);text-align:center;padding:22px 16px 30px}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(20,30,42,.45);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.modal{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 30px 60px rgba(0,0,0,.25)}
.modal .mh{display:flex;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
.modal .mh button{margin-left:auto;border:0;background:none;font-size:22px;line-height:1;color:var(--mut)}
.modal .mb{padding:18px 20px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center;position:sticky;bottom:0;background:#fff}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:61;box-shadow:-20px 0 50px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .22s;overflow:auto}
.drawer.on{transform:none}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--mut)}
.field input,.field select,.field textarea{font:inherit;font-size:14px;font-weight:400;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;min-width:0}
.jel{display:grid;grid-template-columns:2fr 1.4fr 1fr 1fr 28px;gap:8px;align-items:center;margin-bottom:8px}
.jel input,.jel select{font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-width:0;width:100%}
.jel input{text-align:right}
.jel button{border:0;background:none;color:var(--mut);font-size:18px}
.dl{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;font-size:14px;margin:0}
.dl dt{color:var(--mut)}.dl dd{margin:0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:80;transition:.2s;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}
.stmt td{padding:7px 14px}.stmt .tot td{font-weight:900;border-top:2px solid var(--navy)}.stmt .sec td{font-weight:700;color:var(--navy);background:#f8f9fb}
.stmt .ind td:first-child{padding-left:30px}

@media (max-width:1100px){.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.c21{grid-template-columns:1fr}}
@media (max-width:860px){
  .burger{display:block}.hub,.role span{display:none}
  nav.side{position:fixed;left:0;top:64px;z-index:40;transform:translateX(-100%);transition:transform .2s;height:calc(100vh - 64px)}
  nav.side.on{transform:none;box-shadow:20px 0 40px rgba(0,0,0,.25)}
  main{padding:20px 16px 50px}
  .k3,.k2{grid-template-columns:1fr}
  .search{display:none}
}
@media (max-width:560px){.top{gap:8px;padding:0 12px}.top .av{width:32px;height:32px;font-size:12px}.role select{max-width:110px!important;padding:6px 4px}.head .acts{margin-left:0}.k4{grid-template-columns:1fr 1fr}.kpi .v{font-size:22px}.top .logo{height:26px}.role select{max-width:120px}.jel{grid-template-columns:1fr 1fr}.dl{grid-template-columns:1fr}.hb{grid-template-columns:110px 1fr 62px}}
@media (max-width:380px){.top .av{display:none}.top .logo{height:22px}}
</style>
</head>

function collChart(){
 const W=660,H=230,pl=44,pb=26,pt=12,max=8,bw=(W-pl-10)/12;
 const y=v=>pt+(H-pt-pb)*(1-v/max);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Monthly collections versus budget, last 12 months">`;
 [0,2,4,6,8].forEach(v=>s+=`<line x1="${pl}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="#e7ebf0"/><text x="${pl-8}" y="${y(v)+4}" font-size="11" fill="#5d6878" text-anchor="end">$${v}M</text>`);
 COLL.forEach((v,i)=>{const x=pl+i*bw+bw*.18,w=bw*.64,last=i===11;
  s+=`<rect x="${x}" y="${y(v)}" width="${w}" height="${y(0)-y(v)}" rx="3" fill="${last?'#b8c7de':'#6685b5'}"><title>${MONTHS[i]}: $${v.toFixed(2)}M collected${last?' (month to date)':''} · budget $${BUD[i].toFixed(1)}M</title></rect>`;
  s+=`<text x="${x+w/2}" y="${H-8}" font-size="11" fill="#5d6878" text-anchor="middle">${MONTHS[i]}</text>`});
 s+=`<polyline fill="none" stroke="#b69f83" stroke-width="2.5" stroke-dasharray="5 4" points="${BUD.map((v,i)=>`${pl+i*bw+bw/2},${y(v)}`).join(' ')}"/>`;
 return s+'</svg><div class="legend"><span><i style="background:#6685b5"></i>Collections</span><span><i style="background:#b8c7de"></i>November, month to date</span><span><i style="background:#b69f83"></i>Budget</span></div>';
}
function hbars(rows,max,color='#6685b5',fmt=$k){return rows.map(([l,v])=>`<div class="hb"><span title="${esc(l)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l)}</span><div class="bar"><i style="width:${(v/max*100).toFixed(1)}%;background:${color}"></i></div><b class="n" style="text-align:right">${fmt(v)}</b></div>`).join('')}
function spark(vals,w=120,h=34,c='#6685b5'){const mx=Math.max(...vals),mn=Math.min(...vals);return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${c}" stroke-width="2" points="${vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-3-(v-mn)/(mx-mn||1)*(h-6)).toFixed(1)}`).join(' ')}"/></svg>`}

/* ---------- render ---------- */
function render(){const k=route();renderNav();$('#main').innerHTML=(P[k]||P.home)()+'<footer class="f">Metro Hub · concept prototype by Casting Karma · sample data</footer>';document.title=(TITLES[k]||'Home')+' · Metro Hub';$('#side').classList.remove('on');}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});

/* ---------- overlays ---------- */
function modal(title,body,foot){$('#modal').innerHTML=`<div class="mh"><h2>${title}</h2><button data-x aria-label="Close">×</button></div><div class="mb">${body}</div>${foot?`<div class="mf">${foot}</div>`:''}`;$('#ov').classList.add('on');setTimeout(()=>{const f=$('#modal').querySelector('input,select,button.p');f&&f.focus()},30)}
const closeModal=()=>$('#ov').classList.remove('on');
function drawer(html){$('#drawer').innerHTML=`<div class="modal" style="box-shadow:none;max-height:none"><div class="mh"><h2>Details</h2><button data-xd aria-label="Close">×</button></div><div class="mb">${html}</div></div>`;$('#drawer').classList.add('on')}
const closeDrawer=()=>$('#drawer').classList.remove('on');
addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer();$('#results').classList.remove('on')}});
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal()});

function jeModal(){
 const opts=ACCTS.map(a=>`<option value="${a.no}">${a.no} · ${esc(a.name)}</option>`).join('');const tags='<option>— no tag —</option>'+FAC.map(f=>`<option>${esc(f.name)}</option>`).join('')+['Finance','Revenue Cycle','Credentialing','HR','IT'].map(d=>`<option>Dept · ${d}</option>`).join('');
 const line=(a,dr,cr)=>`<div class="jel"><select aria-label="Account">${opts.replace(`value="${a}"`,`value="${a}" selected`)}</select><select aria-label="Tag">${tags}</select><input inputmode="decimal" placeholder="Debit" value="${dr}" aria-label="Debit"><input inputmode="decimal" placeholder="Credit" value="${cr}" aria-label="Credit"><button data-rm aria-label="Remove line">×</button></div>`;
 modal('New journal entry',`<div class="grid k2" style="margin-bottom:14px"><label class="field">Date<input id="jd" value="Nov 19, 2026"></label><label class="field">Memo<input id="jm" value="Reclass — CME travel to department"></label></div>
 <div class="jel small muted" style="font-weight:700"><span>Account</span><span>Tag</span><span style="text-align:right">Debit</span><span style="text-align:right">Credit</span><span></span></div><div id="jl">${line('5500','1,250.00','')}${line('1000','','1,250.00')}</div>
 <button class="btn s" data-act="jeadd">+ Add line</button><p id="jbal" class="small" style="margin:12px 0 0"></p>`,`<button class="btn" data-x>Cancel</button><button class="btn p" id="jpost" data-act="jepost">Submit for approval</button>`);
 $('#jl')._line=line;jeCheck();
}
function jeCheck(){let d=0,c=0;document.querySelectorAll('#jl .jel').forEach(r=>{const i=r.querySelectorAll('input');d+=+(i[0].value.replace(/[,$]/g,''))||0;c+=+(i[1].value.replace(/[,$]/g,''))||0});
 const ok=d>0&&Math.abs(d-c)<0.005;$('#jbal').innerHTML=`Debits <b>${$c(d)}</b> · Credits <b>${$c(c)}</b> — ${ok?'<span class="up">balanced</span>':'<span class="dn">out of balance by '+$c(Math.abs(d-c))+'</span>'}`;$('#jpost').disabled=!ok;return d}

function stmt(id){const p=PHYS.find(x=>x.id===id),rate=56.4,g=p.units*rate,oh=g*.088;
 const pay=[['Medicare',.24],['BCBS of Texas',.29],['UnitedHealthcare',.2],['Aetna',.11],['Cigna',.08],['Medicaid / MCOs',.05],['Self-pay & other',.03]];
 modal(`${p.name} · November statement`,`<dl class="dl"><dt>Focus</dt><dd>${p.dept}</dd><dt>Home facility</dt><dd>${esc(p.home)}</dd><dt>Status</dt><dd>${p.track}</dd></dl>
 <div class="tw" style="margin:16px 0 0;border:1px solid var(--line);border-radius:10px"><table class="stmt"><tr class="sec"><td>Production by payer class</td><td class="n">Units</td><td class="n">Amount</td></tr>${pay.map(([n,s])=>`<tr class="ind"><td>${n}</td><td class="n">${num(p.units*s)}</td><td class="n">${$$(g*s)}</td></tr>`).join('')}
 <tr class="tot"><td>Gross production</td><td class="n">${num(p.units)}</td><td class="n">${$$(g)}</td></tr><tr class="ind"><td>Overhead allocation (8.8%)</td><td></td><td class="n">(${$$(oh)})</td></tr><tr class="ind"><td>Malpractice — individual share</td><td></td><td class="n">(${$$(1830)})</td></tr><tr class="tot"><td>Net distribution</td><td></td><td class="n">${$$(g-oh-1830)}</td></tr></table></div>`,`<button class="btn" data-act="toast" data-msg="Statement PDF downloaded.">Download PDF</button><button class="btn p" data-x>Done</button>`)}

function pl(){const r=(l,v,c='ind')=>`<tr class="${c}"><td>${l}</td><td class="n">${v===''?'':v<0?'('+$$(-v)+')':$$(v)}</td></tr>`;
 modal('Profit & loss · Jan–Nov 2026',`<div class="tw" style="margin:0;border:1px solid var(--line);border-radius:10px"><table class="stmt">${r('Revenue','','sec')}${r('Professional fee revenue',71244800)}${r('Hospital stipend revenue',4352000)}${r('COPRACTICA network fees',618400)}${r('Total revenue',76215200,'tot')}${r('Operating expenses','','sec')}${r('Staff wages & taxes',6148200)}${r('Malpractice insurance',2460000)}${r('Billing & collections',1984600)}${r('Rent, IT & other',1890000)}${r('Total operating expenses',12482800,'tot')}${r('Income available for physician distribution',63732400,'tot')}${r('Physician distributions',58920400)}${r('Retained for reserves & Q4 true-up',4812000,'tot')}</table></div>`,`<button class="btn" data-act="toast" data-msg="P&L exported to Excel.">Export</button><button class="btn p" data-x>Done</button>`)}
function bs(){const r=(l,v,c='ind')=>`<tr class="${c}"><td>${l}</td><td class="n">${v===''?'':$$(v)}</td></tr>`;
 modal('Balance sheet · Nov 18, 2026',`<div class="tw" style="margin:0;border:1px solid var(--line);border-radius:10px"><table class="stmt">${r('Assets','','sec')}${r('Cash — 3 accounts',14820321)}${r('Patient A/R (net)',8896420)}${r('Stipend A/R',612000)}${r('Equipment & IT (net)',384200)}${r('Total assets',24712941,'tot')}${r('Liabilities & equity','','sec')}${r('Accounts payable',612480)}${r('Accrued payroll',236480)}${r('Distributions payable',5871300)}${r('Malpractice payable',410000)}${r('Partners’ capital',17582681)}${r('Total liabilities & equity',24712941,'tot')}</table></div>`,`<button class="btn p" data-x>Done</button>`)}

/* ---------- actions ---------- */
function approve(k,id){
 if(k==='bill'){const b=BILLS.find(x=>x.id===id);if(b){b.s='Approved';audit('Approved '+b.id+' · '+b.v+' · '+$$(b.a));toast(`Approved ${b.v} · ${$$(b.a)} — added to the Nov 25 payment run.`)}}
 else if(k==='je'){const j=JE.find(x=>x.id===id);if(j){j.status='Posted';audit('Approved and posted '+j.id);toast(`${j.id} approved and posted to the ledger.`)}}
 else if(k==='pto'){const p=PTO[+id.slice(3)];if(p){p.s='Approved';audit('Approved time off · '+p.who);toast(`Approved · ${p.who}, ${p.dates}. Call schedule updated.`)}}
 else{DONE.add(id);audit('Signed offer letter · Dr. Aisha Navarro');toast('Offer letter signed and sent to Dr. Aisha Navarro.')}
 render();
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act],[data-go],[data-x],[data-xd],[data-lt],[data-pt],[data-dt],[data-person],[data-stmt],[data-fac],[data-rm]');if(!t)return;
 const d=t.dataset,a=d.act;
 if('x' in d)return closeModal(); if('xd' in d)return closeDrawer();
 if(d.go){location.hash='#/'+d.go;return}
 if(d.lt){LT=d.lt;return render()} if(d.pt){PT=d.pt;return render()} if(d.dt){DT=d.dt;return render()}
 if(d.person){const p=PEOPLE.find(x=>x.id===d.person);return drawer(`<div style="display:flex;gap:14px;align-items:center;margin-bottom:16px"><div class="av" style="width:56px;height:56px;font-size:18px">${ini(p.name)}</div><div><h2>${esc(p.name)}</h2><span class="muted">${esc(p.title)}</span></div></div><dl class="dl"><dt>Department</dt><dd>${esc(p.dept)}</dd><dt>${p.kind==='Physician'?'Home facility':'Location'}</dt><dd>${esc(p.home)}</dd><dt>With Metro since</dt><dd>${p.since}</dd><dt>Extension</dt><dd>${p.ext}</dd>${p.track?`<dt>Status</dt><dd>${p.track}</dd>`:''}</dl>${ROLE==='cfo'||ROLE==='hr'?`<h3 style="margin:20px 0 8px">HR (visible to HR & Finance only)</h3><dl class="dl"><dt>Employment</dt><dd>${p.kind==='Staff'?'W-2 · full time':'Partner · K-1'}</dd><dt>Time off balance</dt><dd>${p.kind==='Staff'?'11.5 days':'18 days'}</dd><dt>Benefits</dt><dd>Enrolled · 2027 pending</dd></dl>`:''}`)}
 if(d.stmt){if(ROLE==='md'||ROLE==='cfo')return stmt(d.stmt)}
 if(d.fac){const f=FAC.find(x=>x.id===d.fac);return drawer(`<h2>${esc(f.name)}</h2><p class="muted" style="margin:4px 0 16px">${f.type} · ${f.city}, TX</p><dl class="dl"><dt>Contract</dt><dd>${pill(f.contract)}</dd><dt>Monthly stipend</dt><dd>${f.stipend?$$(f.stipend):'None'}</dd><dt>Renewal</dt><dd>${f.contract==='Exclusive'?'Jun 30, 2027 · alert at 180 days':'Rolling'}</dd><dt>Cases · Nov MTD</dt><dd>${num(f.cases)}</dd><dt>Collections MTD</dt><dd>${$$(f.coll)}</dd><dt>Coverage</dt><dd>${f.fte} FTE</dd></dl><h3 style="margin:20px 0 8px">Physicians assigned</h3>${PHYS.filter(p=>p.home===f.name).map(p=>`<div class="check"><span>${p.name}</span><small>${p.dept}</small></div>`).join('')||'<p class="muted small">Float pool coverage</p>'}`)}
 if('rm' in d){const r=t.closest('.jel');if(document.querySelectorAll('#jl .jel').length>2){r.remove();jeCheck()}return}
 switch(a){
  case 'approve':return approve(d.k,d.id);
  case 'review':if(d.k==='bill'){PT='Awaiting approval';location.hash='#/payables'}else if(d.k==='je')location.hash='#/ledger';else if(d.k==='pto')location.hash='#/timeoff';else toast('Offer letter opened for review.');return;
  case 'deny':PTO[+d.id].s='Denied';audit('Denied time off · '+PTO[+d.id].who);toast('Request denied — the employee was notified with your note.');return render();
  case 'done':DONE.add(d.id);toast('Done — removed from your tasks.');return render();
  case 'toast':closeModal();return toast(d.msg);
  case 'newje':return jeModal();
  case 'jeadd':$('#jl').insertAdjacentHTML('beforeend',$('#jl')._line('5100','',''));return jeCheck();
  case 'jepost':{const amt=jeCheck();const id='JE-2611-0'+(42+JE.length-6);JE.unshift({id,date:'Nov 19',memo:$('#jm').value||'Journal entry',by:ROLES[ROLE].user.name,amt,status:'Pending approval'});audit('Created '+id+' · '+$c(amt));closeModal();toast(id+' submitted — it’s in the approver’s task list.');LT='All';location.hash='#/ledger';return render()}
  case 'newbill':return modal('Enter a bill',`<div class="grid k2"><label class="field">Vendor<select id="bv">${VEND.map(v=>`<option>${v}</option>`).join('')}</select></label><label class="field">Amount<input id="ba" value="3,420.00" inputmode="decimal"></label><label class="field">Description<input id="bd" value="Supplies — December"></label><label class="field">Due date<input id="bdue" value="Dec 10"></label></div><p class="small muted">Bills over $10,000 route to the CFO; under that, to the controller.</p>`,`<button class="btn" data-x>Cancel</button><button class="btn p" data-act="billsave">Save bill</button>`);
  case 'billsave':{const amt=+$('#ba').value.replace(/[,$]/g,'')||0;const b={id:'BL-'+(4810+BILLS.length),v:$('#bv').value,d:$('#bd').value,a:amt,due:$('#bdue').value,s:'Awaiting approval'};BILLS.unshift(b);audit('Entered '+b.id+' · '+b.v);closeModal();toast(b.id+' saved and routed for approval.');PT='All';return render()}
  case 'payrun':{const ap=BILLS.filter(b=>b.s==='Approved');return modal('Schedule payment run',`<p>ACH on <b>Tue, Nov 25</b> from Operating ··4410.</p>${ap.length?ap.map(b=>`<div class="check"><span>${esc(b.v)}</span><small>${$c(b.a)}</small></div>`).join(''):'<p class="muted">No approved bills waiting.</p>'}<p style="margin-top:12px"><b>Total ${$c(ap.reduce((x,b)=>x+b.a,0))}</b></p>`,`<button class="btn" data-x>Cancel</button><button class="btn p" data-act="payrunok" ${ap.length?'':'disabled'}>Schedule</button>`)}
  case 'payrunok':BILLS.forEach(b=>{if(b.s==='Approved')b.s='Scheduled'});audit('Scheduled ACH payment run · Nov 25');closeModal();toast('Payment run scheduled for Nov 25.');return render();
  case 'stipend':return toast('6 stipend invoices for December drafted — review before sending.');
  case 'recon':return toast('Payroll ··4428: 3 items left to match. Operating and Reserve are reconciled.');
  case 'match':{t.closest('tr').remove();const left=document.querySelectorAll('#unm tr[data-row]').length;audit('Matched bank transaction · Payroll ··4428');return toast(left?`Matched. ${left} left.`:'All matched — Payroll ··4428 is reconciled.')}
  case 'pl':return pl(); case 'bs':return bs();
  case 'dist':return modal('Run November distribution',`<p>Production locked through Nov 30 · blended rate <b>$56.40</b> · overhead <b>8.8%</b>.</p><div class="grid k3" style="margin:14px 0">${kpi('Physicians','112','')}${kpi('Gross production','$6.44M','')}${kpi('Net distribution','$5.87M','')}</div><p class="small muted">Submitting sends the run to the CFO for approval. Statements publish to each physician’s My Pay when it’s approved. Pays Dec 5.</p>`,`<button class="btn" data-x>Cancel</button><button class="btn p" data-act="distok">Submit for approval</button>`);
  case 'distok':DIST.status='Submitted for approval';audit('Submitted November physician distribution · $5.87M');closeModal();toast('November distribution submitted for CFO approval.');return render();
  case 'reqpto':return modal('Request time off',`<div class="grid k2"><label class="field">Type<select id="pt"><option>Vacation</option><option>CME</option><option>Personal</option><option>Sick</option></select></label><label class="field">Dates<input id="pd" value="Dec 14 – Dec 18"></label></div><p class="small muted">Your manager and the scheduling committee are notified. Coverage is checked against the call schedule.</p>`,`<button class="btn" data-x>Cancel</button><button class="btn p" data-act="ptook">Send request</button>`);
  case 'ptook':PTO.unshift({who:ROLES[ROLE].user.name,type:$('#pt').value,dates:$('#pd').value,days:5,s:'Pending'});audit('Requested time off · '+$('#pd').value);closeModal();toast('Request sent.');return render();
 }
});
document.addEventListener('input',e=>{if(e.target.closest('#jl'))jeCheck();if(e.target.id==='dq'){DQ=e.target.value;const pos=e.target.selectionStart;render();const n=$('#dq');n.focus();n.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{const c=e.target.dataset&&e.target.dataset.close;if(c!==undefined){CLOSE[+c][1]=e.target.checked;if(+c===CLOSE.length-1&&e.target.checked){audit('Closed period · November 2026');toast('November 2026 is closed. Entries to that period are now locked.')}render()}if(e.target.matches('[data-onb]'))e.target.closest('.check').classList.toggle('done',e.target.checked)});

/* role + search + chrome */
$('#role').innerHTML=Object.entries(ROLES).map(([k,r])=>`<option value="${k}">${r.label}</option>`).join('');
$('#role').addEventListener('change',e=>{ROLE=e.target.value;location.hash='#/home';render();toast('Now viewing as '+ROLES[ROLE].user.name+' · '+ROLES[ROLE].label)});
$('#burger').addEventListener('click',()=>$('#side').classList.toggle('on'));
$('#bell').addEventListener('click',()=>{location.hash='#/home';render()});
const IDX=[...PEOPLE.map(p=>({l:p.name,s:p.title,go:()=>{location.hash='#/directory';setTimeout(()=>document.querySelector(`[data-person="${p.id}"]`)?.click(),30)}})),...FAC.map(f=>({l:f.name,s:'Facility',go:()=>{location.hash='#/facilities';setTimeout(()=>document.querySelector(`[data-fac="${f.id}"]`)?.click(),30)}})),...VEND.map(v=>({l:v,s:'Vendor',go:()=>{location.hash='#/payables'}})),...ACCTS.map(a=>({l:a.no+' · '+a.name,s:'GL account',go:()=>{location.hash='#/ledger'}}))];
let HITS=[];
$('#q').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();const r=$('#results');if(!q){r.classList.remove('on');return}
 HITS=IDX.filter(x=>x.l.toLowerCase().includes(q)).slice(0,8);r.innerHTML=HITS.length?HITS.map((h,i)=>`<button data-hit="${i}">${esc(h.l)}<small>${h.s}</small></button>`).join(''):'<div class="empty">No matches</div>';r.classList.add('on')});
$('#results').addEventListener('click',e=>{const b=e.target.closest('[data-hit]');if(!b)return;const h=HITS[+b.dataset.hit];$('#results').classList.remove('on');$('#q').value='';h.go()});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#results').classList.remove('on')});
render();
</script>
</body>
